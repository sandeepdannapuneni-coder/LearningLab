<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Simulation Lab &mdash; AV's ICSE Arena</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="../vendor/three.min.js"></script>
<style>
  :root {
    --bg: #0a0e26;
    --bg2: #161043;
    --panel: #141a3f;
    --panel-2: #0f1430;
    --line: rgba(255,255,255,0.09);
    --fg: #f4f2ff;
    --muted: #9aa0c7;
    --faint: #5d6391;
    --math: #b794f6;
    --physics: #4fd1e8;
    --chem: #68e7a0;
    --bio: #ff8aa8;
    --geo: #5ee6c4;
    --history: #e0a96d;
    --accent: #ffd166;
    --accent-ink: #2a1c00;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(1200px 800px at 15% -10%, var(--bg2), transparent 60%), var(--bg);
    color: var(--fg);
    font-family: 'Nunito', system-ui, sans-serif;
    padding-inline: 14px;
    padding-block: 18px 30px;
  }
  h1, h2, h3, .heading { font-family: 'Baloo 2', 'Nunito', sans-serif; }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }

  .wrap { max-width: 1180px; margin: 0 auto; }

  header.top {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    flex-wrap: wrap; margin-bottom: 14px;
  }
  .brand { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .brand .logo {
    width: 36px; height: 36px; border-radius: 10px;
    background: linear-gradient(135deg, var(--math), var(--physics));
    display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
  }
  h1 { font-size: 1.4rem; margin: 0; font-weight: 800; }
  .proto-tag {
    font-family: 'IBM Plex Mono', monospace; font-size: 0.65rem; letter-spacing: 0.07em;
    color: var(--muted); border: 1px solid var(--line); padding: 5px 10px; border-radius: 999px;
  }

  .shell { display: grid; grid-template-columns: 230px minmax(0,1fr); gap: 14px; }
  @media (max-width: 820px) { .shell { grid-template-columns: 1fr; } }

  nav.sidebar {
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    padding: 10px; display: flex; flex-direction: column; gap: 4px;
    max-height: 78vh; overflow-y: auto;
  }
  @media (max-width: 820px) {
    nav.sidebar { flex-direction: row; overflow-x: auto; overflow-y: visible; max-height: none; gap: 8px; }
  }
  .group-label {
    font-family: 'IBM Plex Mono', monospace; font-size: 0.65rem; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--muted); padding: 10px 10px 4px;
  }
  .sim-btn {
    display: flex; align-items: center; gap: 8px; text-align: left;
    background: transparent; border: 1px solid transparent; border-radius: 10px;
    color: var(--fg); font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 0.86rem;
    padding: 9px 10px; cursor: pointer; white-space: nowrap; flex-shrink: 0;
  }
  .sim-btn .ic { font-size: 1.05rem; }
  .sim-btn:hover { background: rgba(255,255,255,0.05); }
  .sim-btn.active { background: rgba(255,255,255,0.08); border-color: var(--line); }
  .sim-btn .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

  main.stage-area { display: flex; flex-direction: column; gap: 12px; min-width: 0; }

  .stage-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .stage-head .ttl { display: flex; align-items: center; gap: 8px; }
  .subject-chip {
    font-family: 'IBM Plex Mono', monospace; font-size: 0.65rem; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line);
  }
  h2.sim-title { margin: 0; font-size: 1.2rem; }

  .viewport-card {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 16px;
    overflow: hidden; position: relative;
  }
  #viewport { width: 100%; aspect-ratio: 16/9; display: block; }
  #viewport canvas { width: 100% !important; height: 100% !important; display: block; }
  .drag-hint {
    position: absolute; bottom: 8px; right: 10px; font-size: 0.68rem; color: var(--muted);
    background: rgba(10,14,38,0.55); padding: 3px 8px; border-radius: 6px; pointer-events: none;
  }

  .panels { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 12px; }
  @media (max-width: 820px) { .panels { grid-template-columns: 1fr; } }

  .rail, .side-info {
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px;
    display: flex; flex-direction: column; gap: 12px; min-width: 0;
  }
  .rail h3, .side-info h3 {
    font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0;
  }
  .control { display: flex; flex-direction: column; gap: 6px; }
  .control .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .control label { font-size: 0.85rem; font-weight: 700; }
  .control .val { font-family: 'IBM Plex Mono', monospace; font-size: 0.82rem; color: var(--accent); }
  input[type="range"] { width: 100%; accent-color: var(--accent); height: 20px; }

  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
  button.lab-btn {
    font: inherit; font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 0.82rem;
    border: 1px solid var(--line); background: var(--panel-2); color: var(--fg);
    padding: 9px 14px; border-radius: 10px; cursor: pointer; transition: border-color .15s, transform .1s;
  }
  button.lab-btn:hover { border-color: var(--accent); }
  button.lab-btn:active { transform: scale(0.97); }
  button.lab-btn:focus-visible { outline: 2px solid var(--physics); outline-offset: 2px; }
  button.lab-btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.lab-btn.chip { padding: 6px 11px; font-size: 0.74rem; }
  button.lab-btn.chip.active { border-color: var(--physics); color: var(--physics); background: rgba(79,209,232,0.12); }

  .readouts { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px,1fr)); gap: 8px; }
  .readout { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  .readout .k { font-size: 0.64rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .readout .v { font-family: 'IBM Plex Mono', monospace; font-size: 1rem; margin-top: 2px; }

  .formula-box {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
  }
  .formula-box .f-label { font-size: 0.68rem; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
  .formula-box .f-body { font-family: 'IBM Plex Mono', monospace; font-size: 0.95rem; }
  .formula-box .f-body .hi { color: var(--accent); }

  .concept-text { font-size: 0.84rem; line-height: 1.5; color: var(--muted); }
  .concept-text strong { color: var(--fg); }

  .glossary {
    display: flex; flex-direction: column; gap: 9px;
    margin-top: 6px; padding-top: 12px; border-top: 1px dashed var(--line);
  }
  .glossary .glossary-head {
    font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted);
    display: flex; align-items: center; gap: 6px;
  }
  .glossary-item { font-size: 0.8rem; line-height: 1.45; color: var(--muted); }
  .glossary-item strong { color: var(--fg); font-weight: 700; }
  .glossary-item.term strong { color: var(--accent); }

  /* ---- CSS 3D cube-net module ---- */
  .net-stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; perspective: 900px; }
  .net-inner { position: relative; width: 120px; height: 120px; transform-style: preserve-3d; transform: rotateX(-24deg) rotateY(28deg); }
  .face {
    position: absolute; width: 120px; height: 120px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 1.3rem; color: #0a0e26;
    box-shadow: inset 0 0 0 2px rgba(0,0,0,0.25);
    transform-style: preserve-3d;
  }

  @media (prefers-reduced-motion: reduce) {
    * { scroll-behavior: auto !important; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo">🧪</div>
      <h1>Simulation Lab</h1>
    </div>
    <span class="proto-tag">PROTOTYPE BATCH · 12 SIMULATIONS · FOR REVIEW</span>
  </header>

  <div class="shell">
    <nav class="sidebar" id="sidebar"></nav>

    <main class="stage-area">
      <div class="stage-head">
        <div class="ttl">
          <span class="subject-chip" id="subjectChip">Physics</span>
          <h2 class="sim-title" id="simTitle">Loading…</h2>
        </div>
        <div class="btn-row" id="globalControls"></div>
      </div>

      <div class="viewport-card">
        <div id="viewport"></div>
        <div class="drag-hint" id="dragHint" style="display:none;">drag to rotate</div>
      </div>

      <div class="panels">
        <div class="rail">
          <h3>Controls</h3>
          <div id="controls"></div>
        </div>
        <div class="side-info">
          <h3>Readouts</h3>
          <div class="readouts" id="readouts"></div>
          <div class="formula-box">
            <div class="f-label">Formula</div>
            <div class="f-body mono" id="formula"></div>
          </div>
          <h3>Concept</h3>
          <p class="concept-text" id="concept"></p>
        </div>
      </div>
    </main>
  </div>
</div>

<script>
(function () {
  "use strict";

  var reducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------------- LabKit: shared helpers ----------------
  var LabKit = (function () {
    function elt(tag, cls, html) {
      var e = document.createElement(tag);
      if (cls) e.className = cls;
      if (html !== undefined) e.innerHTML = html;
      return e;
    }

    function slider(container, opts) {
      var wrap = elt("div", "control");
      var row = elt("div", "row");
      var label = elt("label", null, opts.label);
      label.setAttribute("for", opts.key);
      var valSpan = elt("span", "val");
      row.appendChild(label);
      row.appendChild(valSpan);
      var input = document.createElement("input");
      input.type = "range";
      input.id = opts.key;
      input.min = opts.min;
      input.max = opts.max;
      input.step = opts.step;
      input.value = opts.value;
      function fmt(v) {
        var text = opts.decimals !== undefined ? v.toFixed(opts.decimals) : String(v);
        return text + (opts.unit || "");
      }
      valSpan.textContent = fmt(parseFloat(input.value));
      input.addEventListener("input", function () {
        var v = parseFloat(input.value);
        valSpan.textContent = fmt(v);
        opts.onInput(v);
      });
      wrap.appendChild(row);
      wrap.appendChild(input);
      container.appendChild(wrap);
      return input;
    }

    function readout(container, key, label) {
      var box = elt("div", "readout");
      box.innerHTML = '<div class="k">' + label + '</div><div class="v mono" id="ro-' + key + '">—</div>';
      container.appendChild(box);
      return document.getElementById("ro-" + key);
    }

    function button(container, label, onClick, cls) {
      var b = document.createElement("button");
      b.className = "lab-btn " + (cls || "");
      b.textContent = label;
      b.addEventListener("click", onClick);
      container.appendChild(b);
      return b;
    }

    // Renders a "Learn the Terms" block under the sliders: a few key
    // definitions, then a one-liner per parameter explaining what moving
    // that specific slider actually does. `items` is an array of
    // {term, text} pairs; pass `kind: "param"` entries for the per-slider
    // effect notes so they get a slightly different visual treatment.
    function glossary(container, items) {
      var wrap = elt("div", "glossary");
      var head = elt("div", "glossary-head", "📖 Learn the Terms");
      wrap.appendChild(head);
      items.forEach(function (it) {
        var row = elt("div", "glossary-item" + (it.kind === "term" ? " term" : ""));
        row.innerHTML = "<strong>" + it.term + "</strong> — " + it.text;
        wrap.appendChild(row);
      });
      container.appendChild(wrap);
      return wrap;
    }

    // --- shared Three.js renderer, reused across 3D modules to avoid
    // piling up WebGL contexts as a student clicks through many sims ---
    var sharedRenderer = null;
    function getRenderer() {
      if (!sharedRenderer) {
        sharedRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        sharedRenderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      }
      return sharedRenderer;
    }

    function threeBoot(container) {
      var renderer = getRenderer();
      container.innerHTML = "";
      container.appendChild(renderer.domElement);

      var scene = new THREE.Scene();
      var camera = new THREE.PerspectiveCamera(42, 1, 0.1, 200);

      var hemi = new THREE.HemisphereLight(0xffffff, 0x1a1046, 1.0);
      scene.add(hemi);
      var dir = new THREE.DirectionalLight(0xffffff, 0.9);
      dir.position.set(4, 6, 5);
      scene.add(dir);

      var radius = 6, theta = Math.PI / 4, phi = Math.PI / 3.1;
      var target = new THREE.Vector3(0, 0, 0);

      function updateCam() {
        camera.position.set(
          target.x + radius * Math.sin(phi) * Math.sin(theta),
          target.y + radius * Math.cos(phi),
          target.z + radius * Math.sin(phi) * Math.cos(theta)
        );
        camera.lookAt(target);
      }

      function resize() {
        var w = container.clientWidth, h = container.clientHeight;
        if (!w || !h) return;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h, false);
      }

      var dragging = false, lastX = 0, lastY = 0, idleAuto = true;
      function pos(e) { return e.touches ? [e.touches[0].clientX, e.touches[0].clientY] : [e.clientX, e.clientY]; }
      function down(e) { dragging = true; idleAuto = false; var p = pos(e); lastX = p[0]; lastY = p[1]; }
      function move(e) {
        if (!dragging) return;
        var p = pos(e), dx = p[0] - lastX, dy = p[1] - lastY;
        lastX = p[0]; lastY = p[1];
        theta -= dx * 0.01;
        phi = Math.min(Math.max(phi - dy * 0.01, 0.35), Math.PI - 0.35);
        updateCam();
      }
      function up() { dragging = false; }

      renderer.domElement.addEventListener("mousedown", down);
      renderer.domElement.addEventListener("mousemove", move);
      window.addEventListener("mouseup", up);
      renderer.domElement.addEventListener("touchstart", down, { passive: true });
      renderer.domElement.addEventListener("touchmove", move, { passive: true });
      window.addEventListener("touchend", up);
      window.addEventListener("resize", resize);

      updateCam();
      resize();

      var rafId = null;
      var api = {
        scene: scene,
        camera: camera,
        renderer: renderer,
        setRadius: function (r) { radius = r; updateCam(); },
        tickIdleRotate: function () {
          if (idleAuto && !reducedMotion) { theta += 0.0025; updateCam(); }
        },
        setRafId: function (id) { rafId = id; },
        resize: resize,
        dispose: function () {
          if (rafId) cancelAnimationFrame(rafId);
          window.removeEventListener("resize", resize);
          window.removeEventListener("mouseup", up);
          window.removeEventListener("touchend", up);
          renderer.domElement.removeEventListener("mousedown", down);
          renderer.domElement.removeEventListener("mousemove", move);
          // dispose scene geometries/materials but keep the shared renderer alive
          scene.traverse(function (obj) {
            if (obj.geometry) obj.geometry.dispose();
            if (obj.material) {
              if (Array.isArray(obj.material)) obj.material.forEach(function (m) { m.dispose(); });
              else obj.material.dispose();
            }
          });
        },
      };
      return api;
    }

    function canvas2d(container) {
      var c = document.createElement("canvas");
      container.innerHTML = "";
      container.appendChild(c);
      function resize() {
        var rect = container.getBoundingClientRect();
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        c.width = Math.max(1, rect.width * dpr);
        c.height = Math.max(1, rect.height * dpr);
        c.style.width = rect.width + "px";
        c.style.height = rect.height + "px";
      }
      window.addEventListener("resize", resize);
      resize();
      var ctx = c.getContext("2d");
      return {
        ctx: ctx,
        canvas: c,
        dpr: function () { return Math.min(window.devicePixelRatio || 1, 2); },
        dispose: function () { window.removeEventListener("resize", resize); },
      };
    }

    return { el: elt, slider: slider, readout: readout, button: button, glossary: glossary, threeBoot: threeBoot, canvas2d: canvas2d };
  })();

  // ---------------- DOM refs ----------------
  var viewportEl = document.getElementById("viewport");
  var controlsEl = document.getElementById("controls");
  var readoutsEl = document.getElementById("readouts");
  var formulaEl = document.getElementById("formula");
  var conceptEl = document.getElementById("concept");
  var globalControlsEl = document.getElementById("globalControls");
  var dragHintEl = document.getElementById("dragHint");
  var subjectChipEl = document.getElementById("subjectChip");
  var simTitleEl = document.getElementById("simTitle");
  var sidebarEl = document.getElementById("sidebar");

  var SUBJECT_COLOR = { Math: "var(--math)", Physics: "var(--physics)", Chemistry: "var(--chem)", Biology: "var(--bio)", Geography: "var(--geo)", History: "var(--history)" };

  function setFormula(html) { formulaEl.innerHTML = html; }
  function setConcept(html) { conceptEl.innerHTML = html; }
  function clearPanel(el) { el.innerHTML = ""; }

  // ============================================================
  // SIMULATION MODULES
  // Each: { id, subject, title, icon, uses3D, mount() -> disposeFn }
  // mount() receives nothing; it reads the shared DOM refs above and
  // returns a cleanup function the shell calls before mounting the next.
  // ============================================================
  var SIMULATIONS = [];

  // ---------- MATH 1: Pythagoras 3D Proof ----------
  SIMULATIONS.push({
    id: "pyth3d", subject: "Math", title: "Pythagoras — 3D Proof", icon: "📐",
    uses3D: true,
    mount: function () {
      var three = LabKit.threeBoot(viewportEl);
      three.setRadius(10);
      dragHintEl.style.display = "block";

      var group = new THREE.Group();
      three.scene.add(group);

      var state = { a: 3, b: 4 };

      function colorFor(name) {
        return name === "a" ? 0x4fd1e8 : name === "b" ? 0x68e7a0 : 0xffd166;
      }

      function squareMesh(p0, p1, p2, p3, color) {
        var geo = new THREE.BufferGeometry();
        var verts = new Float32Array([
          p0[0], p0[1], p0[2], p1[0], p1[1], p1[2], p2[0], p2[1], p2[2],
          p0[0], p0[1], p0[2], p2[0], p2[1], p2[2], p3[0], p3[1], p3[2],
        ]);
        geo.setAttribute("position", new THREE.BufferAttribute(verts, 3));
        geo.computeVertexNormals();
        var mat = new THREE.MeshStandardMaterial({ color: color, side: THREE.DoubleSide, transparent: true, opacity: 0.85 });
        var mesh = new THREE.Mesh(geo, mat);
        var edges = new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.4 }));
        mesh.add(edges);
        return mesh;
      }

      function rebuild() {
        while (group.children.length) group.remove(group.children[0]);
        var a = state.a, b = state.b, c = Math.sqrt(a * a + b * b);

        var O = [0, 0, 0], A = [a, 0, 0], B = [0, b, 0];
        // triangle outline
        var triGeo = new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(O[0], O[1], O[2]), new THREE.Vector3(A[0], A[1], A[2]),
          new THREE.Vector3(B[0], B[1], B[2]), new THREE.Vector3(O[0], O[1], O[2]),
        ]);
        group.add(new THREE.Line(triGeo, new THREE.LineBasicMaterial({ color: 0xffffff })));

        // square on leg a (erected in -Y)
        group.add(squareMesh(O, A, [a, -a, 0], [0, -a, 0], colorFor("a")));
        // square on leg b (erected in -X)
        group.add(squareMesh(O, B, [-b, b, 0], [-b, 0, 0], colorFor("b")));
        // square on hypotenuse (outward normal (b,a)/c * c = (b,a))
        group.add(squareMesh(A, B, [b, b + a, 0], [a + b, a, 0], colorFor("c")));

        group.position.set(-a / 2, -b / 2, 0);

        setFormula(
          'a² + b² = c² &nbsp; → &nbsp; ' +
          '<span class="hi">' + (a * a) + '</span> + <span class="hi">' + (b * b) + '</span> = <span class="hi">' + (a * a + b * b).toFixed(0) + '</span> &nbsp;|&nbsp; c = ' + c.toFixed(2)
        );
        document.getElementById("ro-a2").textContent = (a * a).toFixed(0);
        document.getElementById("ro-b2").textContent = (b * b).toFixed(0);
        document.getElementById("ro-c").textContent = c.toFixed(2);
      }

      clearPanel(readoutsEl);
      LabKit.readout(readoutsEl, "a2", "a² (cyan)");
      LabKit.readout(readoutsEl, "b2", "b² (green)");
      LabKit.readout(readoutsEl, "c", "c (hypotenuse)");

      clearPanel(controlsEl);
      LabKit.slider(controlsEl, { key: "p-a", label: "Leg a", min: 1, max: 6, step: 0.5, value: state.a, decimals: 1, onInput: function (v) { state.a = v; rebuild(); } });
      LabKit.slider(controlsEl, { key: "p-b", label: "Leg b", min: 1, max: 6, step: 0.5, value: state.b, decimals: 1, onInput: function (v) { state.b = v; rebuild(); } });
      LabKit.glossary(controlsEl, [
        { kind: "term", term: "Leg", text: "one of the two shorter sides that meet at the right angle." },
        { kind: "term", term: "Hypotenuse", text: "the longest side, opposite the right angle — always the diagonal one." },
        { term: "Leg a slider", text: "stretches the triangle sideways and grows the cyan square's area by a²." },
        { term: "Leg b slider", text: "stretches the triangle upward and grows the green square's area by b²." },
      ]);

      setConcept("<strong>The squares-on-sides proof:</strong> build an actual square on each of the two shorter sides and on the hypotenuse. The two smaller squares' areas always add up exactly to the big square's area — that's what the formula a² + b² = c² is really saying, not just an abstract equation.");

      rebuild();

      function loop() {
        three.tickIdleRotate();
        three.renderer.render(three.scene, three.camera);
        three.setRafId(requestAnimationFrame(loop));

  SIMULATIONS.push({

      function draw() {
        var ctx = c2d.ctx, dpr = c2d.dpr(), W = c2d.canvas.width, H = c2d.canvas.height;
        ctx.clearRect(0, 0, W, H);
        var ox = W / 2, oy = H / 2;
        var scale = (W / 20) ; // 20 x-units across width

        // grid
        ctx.strokeStyle = "rgba(255,255,255,0.07)";
        ctx.lineWidth = 1 * dpr;
        for (var gx = -9; gx <= 9; gx++) {

          ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, H); ctx.stroke();
        }
        for (var gy = -9; gy <= 9; gy++) {
          var sy = toScreen(0, gy)[1];

        }
        // axes
        ctx.strokeStyle = "rgba(255,255,255,0.35)";
        ctx.lineWidth = 1.5 * dpr;

        ctx.beginPath(); ctx.moveTo(ox, 0); ctx.lineTo(ox, H); ctx.stroke();

        // curve
        ctx.strokeStyle = "#b794f6";
        ctx.lineWidth = 3 * dpr;
        ctx.beginPath();
        var first = true;
        for (var px = 0; px <= W; px += 2) {
          var xu = (px - ox) / scale;
          var yu = f(xu);
          var sp = toScreen(xu, yu);
          if (sp[1] < -H || sp[1] > 2 * H) { first = true; continue; }
          if (first) { ctx.moveTo(sp[0], sp[1]); first = false; } else { ctx.lineTo(sp[0], sp[1]); }
        }
        ctx.stroke();

        // vertex
        var vx = state.a !== 0 ? -state.b / (2 * state.a) : 0;
        var vy = f(vx);
        var vS = toScreen(vx, vy);
        ctx.fillStyle = "#ffd166";

          if (disc >= 0) {
            var r1 = (-state.b + Math.sqrt(disc)) / (2 * state.a);
            var r2 = (-state.b - Math.sqrt(disc)) / (2 * state.a);
            [r1, r2].forEach(function (r) {

          rootsText = r1.toFixed(2) + ", " + r2.toFixed(2);
        }
        document.getElementById("ro-roots").textContent = rootsText;
        setFormula(
          'y = <span class="hi">' + state.a.toFixed(1) + '</span>x² + <span class="hi">' + state.b.toFixed(1) + '</span>x + <span class="hi">' + state.c.toFixed(1) + '</span>'
        );
      }

      clearPanel(readoutsEl);
      LabKit.readout(readoutsEl, "vertex", "Vertex");
      LabKit.readout(readoutsEl, "roots", "Roots (x-intercepts)");

      clearPanel(controlsEl);
      LabKit.slider(controlsEl, { key: "pb-a", label: "a (shape)", min: -3, max: 3, step: 0.1, value: 1, decimals: 1, onInput: function (v) { state.a = v; } });
      LabKit.slider(controlsEl, { key: "pb-b", label: "b (shift)", min: -6, max: 6, step: 0.1, value: 0, decimals: 1, onInput: function (v) { state.b = v; } });
      LabKit.slider(controlsEl, { key: "pb-c", label: "c (y-intercept)", min: -6, max: 6, step: 0.1, value: 0, decimals: 1, onInput: function (v) { state.c = v; } });
      LabKit.glossary(controlsEl, [
        { kind: "term", term: "Vertex", text: "the single highest or lowest point on the curve." },
        { kind: "term", term: "Roots", text: "the x-values where the curve crosses the x-axis (y = 0)." },
        { term: "a slider", text: "controls how wide or narrow the curve is, and flips it upside-down when negative." },
        { term: "b slider", text: "shifts the vertex left or right along the x-axis." },

    },
  });

  SIMULATIONS.push({
    id: "coinflip", subject: "Math", title: "Law of Large Numbers", icon: "🪙",
    mount: function () {
      var c2d = LabKit.canvas2d(viewportEl);
      var state = { bias: 50, speed: 20, running: true, heads: 0, total: 0, history: [], lastFace: "H" };
      var acc = 0;

      function flipOnce() {
        var isHead = Math.random() * 100 < state.bias;
        state.lastFace = isHead ? "H" : "T";
        state.total++;
        if (isHead) state.heads++;
        var pct = (state.heads / state.total) * 100;
        state.history.push(pct);
        if (state.history.length > 400) state.history.shift();
      }

      function draw() {
        var ctx = c2d.ctx, dpr = c2d.dpr(), W = c2d.canvas.width, H = c2d.canvas.height;
        ctx.clearRect(0, 0, W, H);

        // reference line at bias%
        var refY = H - (state.bias / 100) * (H - 40 * dpr) - 20 * dpr;
        ctx.strokeStyle = "rgba(255,209,102,0.5)";
        ctx.setLineDash([6 * dpr, 6 * dpr]);
        ctx.lineWidth = 1.5 * dpr;
        ctx.beginPath(); ctx.moveTo(0, refY); ctx.lineTo(W, refY); ctx.stroke();
        ctx.setLineDash([]);

        // history line
        ctx.strokeStyle = "#4fd1e8";
        ctx.lineWidth = 2.5 * dpr;
        ctx.beginPath();
        var n = state.history.length;
        for (var i = 0; i < n; i++) {
          var x = (i / Math.max(1, n - 1)) * W;
          var y = H - (state.history[i] / 100) * (H - 40 * dpr) - 20 * dpr;
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();

        // big coin
        ctx.save();
        ctx.translate(W - 60 * dpr, 50 * dpr);
        ctx.fillStyle = state.lastFace === "H" ? "#ffd166" : "#68e7a0";
        ctx.beginPath(); ctx.arc(0, 0, 28 * dpr, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#0a0e26";
        ctx.font = (20 * dpr) + "px 'Baloo 2', sans-serif";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(state.lastFace, 0, 1);
        ctx.restore();

        document.getElementById("ro-heads").textContent = state.heads + " / " + state.total;
        document.getElementById("ro-pct").textContent = state.total ? ((state.heads / state.total) * 100).toFixed(1) + "%" : "—";
      }

      clearPanel(readoutsEl);
      LabKit.readout(readoutsEl, "heads", "Heads / Total");
      LabKit.readout(readoutsEl, "pct", "Heads %");

      clearPanel(controlsEl);
      LabKit.slider(controlsEl, { key: "cf-bias", label: "Coin bias (heads chance)", min: 5, max: 95, step: 1, value: 50, unit: "%", onInput: function (v) { state.bias = v; } });
      LabKit.slider(controlsEl, { key: "cf-speed", label: "Flips per second", min: 1, max: 200, step: 1, value: 20, onInput: function (v) { state.speed = v; } });
      LabKit.glossary(controlsEl, [
        { kind: "term", term: "Bias", text: "how loaded the coin is — 50% is a fair coin, anything else favors one side." },
        { kind: "term", term: "Law of Large Numbers", text: "the rule that a running average gets closer and closer to the true probability the more trials you run." },
        { term: "Coin bias slider", text: "sets the real, hidden probability of landing heads on any single flip." },
        { term: "Flips per second slider", text: "only speeds up or slows down the simulation — it never changes the outcome." },
      ]);

      clearPanel(globalControlsEl);
      var playBtn = LabKit.button(globalControlsEl, "Pause", function () {
        state.running = !state.running;
        playBtn.textContent = state.running ? "Pause" : "Play";
      }, "primary");
      LabKit.button(globalControlsEl, "Reset", function () {
        state.heads = 0; state.total = 0; state.history = [];

      setConcept("Each flip is still a coin toss — totally unpredictable on its own. But the <strong>percentage</strong> of heads so far gets more and more stable the more times you flip, converging toward the true bias. This is the Law of Large Numbers.");

      return function () { if (raf) cancelAnimationFrame(raf); c2d.dispose(); };
    },
  });

            drawBulb(ctx, bx, topY, b, dpr, glowAlpha);
          }
        } else {
          ctx.beginPath(); ctx.moveTo(leftX, topY); ctx.lineTo(leftX + 20 * dpr, topY); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(leftX, botY); ctx.lineTo(leftX + 20 * dpr, botY); ctx.stroke();
          for (var j = 0; j < n; j++) {
            var bx2 = leftX + 20 * dpr + ((j + 0.5) / n) * (rightX - leftX - 40 * dpr);
            ctx.beginPath(); ctx.moveTo(bx2, topY); ctx.lineTo(bx2, botY); ctx.stroke();
            drawBulb(ctx, bx2, (topY + botY) / 2, b, dpr, glowAlpha);
          }
          ctx.beginPath(); ctx.moveTo(rightX - 20 * dpr, topY); ctx.lineTo(rightX, topY); ctx.lineTo(rightX, botY); ctx.lineTo(rightX - 20 * dpr, botY); ctx.stroke();
        }

        document.getElementById("ro-bright").textContent = Math.round(b * 100) + "%";
      }

      function drawBulb(ctx, x, y, b, dpr, glow) {
        var r = 16 * dpr;
        var grad = ctx.createRadialGradient(x, y, 1, x, y, r * 1.8);
        grad.addColorStop(0, "rgba(255,209,102," + (b * glow).toFixed(2) + ")");
        grad.addColorStop(1, "rgba(255,209,102,0)");
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(x, y, r * 1.8, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "rgba(255,209,102," + Math.max(0.15, b).toFixed(2) + ")";
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = "#8a5a0f"; ctx.lineWidth = 2 * dpr; ctx.stroke();
      }

      clearPanel(readoutsEl);
      LabKit.readout(readoutsEl, "bright", "Bulb brightness");

      clearPanel(controlsEl);
      LabKit.slider(controlsEl, { key: "ci-n", label: "Number of bulbs", min: 1, max: 4, step: 1, value: 2, onInput: function (v) { state.n = v; } });
      LabKit.glossary(controlsEl, [
        { kind: "term", term: "Series circuit", text: "components connected in a single loop, sharing one current path." },
        { kind: "term", term: "Parallel circuit", text: "components connected in separate branches, each getting the full voltage." },
        { term: "Number of bulbs slider", text: "in series, adding bulbs makes each one dimmer; in parallel, brightness stays the same no matter how many." },
      ]);

      clearPanel(globalControlsEl);
      var seriesBtn = LabKit.button(globalControlsEl, "Series", function () { state.mode = "series"; seriesBtn.classList.add("active"); parallelBtn.classList.remove("active"); }, "chip active");
      var parallelBtn = LabKit.button(globalControlsEl, "Parallel", function () { state.mode = "parallel"; parallelBtn.classList.add("active"); seriesBtn.classList.remove("active"); }, "chip");

      setFormula("Series: shared voltage splits across every bulb, so brightness ≈ 1/n. Parallel: each branch gets the full source voltage, so brightness stays 100% no matter how many bulbs.");
      setConcept("This is exactly why household wiring uses <strong>parallel</strong> circuits — one bulb burning out, or one appliance switched off, doesn't dim or cut power to anything else on a different branch.");

      var raf = null;
      function loop() { state.t += reducedMotion ? 0 : 0.02; draw(); raf = requestAnimationFrame(loop); }
      loop();

      return function () { if (raf) cancelAnimationFrame(raf); c2d.dispose(); };
    },
  });

  // ---------- PHYSICS 3: Mirror & Light Ray ----------
  SIMULATIONS.push({
    id: "mirror", subject: "Physics", title: "Law of Reflection", icon: "🪞",
    mount: function () {
      var c2d = LabKit.canvas2d(viewportEl);
      var state = { angleDeg: 40, t: 0 };

      function draw() {
        var ctx = c2d.ctx, dpr = c2d.dpr(), W = c2d.canvas.width, H = c2d.canvas.height;
        ctx.clearRect(0, 0, W, H);
        var mx = W * 0.62;
        var hitY = H * 0.5;

        // mirror
        ctx.strokeStyle = "#e7ecf4"; ctx.lineWidth = 4 * dpr;
        ctx.beginPath(); ctx.moveTo(mx, H * 0.08); ctx.lineTo(mx, H * 0.92); ctx.stroke();
        ctx.strokeStyle = "rgba(154,160,199,0.5)"; ctx.lineWidth = 1.5 * dpr;
        for (var yy = H * 0.1; yy < H * 0.9; yy += 14 * dpr) {
          ctx.beginPath(); ctx.moveTo(mx, yy); ctx.lineTo(mx + 10 * dpr, yy + 8 * dpr); ctx.stroke();
        }

        // normal
        ctx.strokeStyle = "rgba(154,160,199,0.6)"; ctx.setLineDash([5 * dpr, 5 * dpr]); ctx.lineWidth = 1.5 * dpr;
        ctx.beginPath(); ctx.moveTo(mx - 120 * dpr, hitY); ctx.lineTo(mx + 120 * dpr, hitY); ctx.stroke();
        ctx.setLineDash([]);

        var rad = (state.angleDeg * Math.PI) / 180;
        var rayLen = 220 * dpr;
        var srcX = mx - Math.cos(rad) * rayLen, srcY = hitY - Math.sin(rad) * rayLen;
        var dstX = mx - Math.cos(rad) * rayLen, dstY = hitY + Math.sin(rad) * rayLen;

        // incident ray (animated progress)
        var prog = Math.min(1, (state.t % 2) / 1);
        var legProg = prog < 0.5 ? prog * 2 : 1;
        ctx.strokeStyle = "#ffd166"; ctx.lineWidth = 3 * dpr;
        ctx.beginPath(); ctx.moveTo(srcX, srcY); ctx.lineTo(srcX + (mx - srcX) * legProg, srcY + (hitY - srcY) * legProg); ctx.stroke();

        if (prog > 0.5) {
          var legProg2 = (prog - 0.5) * 2;
          ctx.strokeStyle = "#4fd1e8"; ctx.lineWidth = 3 * dpr;
          ctx.beginPath(); ctx.moveTo(mx, hitY); ctx.lineTo(mx + (dstX - mx) * legProg2, hitY + (dstY - hitY) * legProg2); ctx.stroke();
        }

        ctx.fillStyle = "#e7ecf4"; ctx.beginPath(); ctx.arc(mx, hitY, 3 * dpr, 0, Math.PI * 2); ctx.fill();
      }

      clearPanel(readoutsEl);
      LabKit.readout(readoutsEl, "i", "Angle of incidence");
      LabKit.readout(readoutsEl, "r", "Angle of reflection");

      clearPanel(controlsEl);
      LabKit.slider(controlsEl, { key: "mr-a", label: "Incoming ray angle", min: 10, max: 80, step: 1, value: 40, unit: "°", onInput: function (v) {
        state.angleDeg = v;
        document.getElementById("ro-i").textContent = v + "°";
        document.getElementById("ro-r").textContent = v + "°";
      } });
      document.getElementById("ro-i").textContent = "40°";
      document.getElementById("ro-r").textContent = "40°";
      LabKit.glossary(controlsEl, [
        { kind: "term", term: "Normal", text: "an imaginary line exactly perpendicular to the mirror's surface — angles are always measured from here, not from the mirror itself." },
        { kind: "term", term: "Angle of incidence / reflection", text: "the angle the incoming ray makes with the normal, and the angle the outgoing ray makes with it." },
        { term: "Incoming ray angle slider", text: "changes both angles together — they're always forced to stay exactly equal." },
      ]);

      setFormula("First Law of Reflection: ∠i = ∠r, always — measured from the <span class=\"hi\">normal</span> (the dashed perpendicular line), never from the mirror's surface.");
      setConcept("No matter how you tilt the incoming ray, the outgoing ray always leaves at the <strong>same angle</strong> from the normal as it arrived — that's the one rule every mirror, periscope and reflecting telescope relies on.");

      var raf = null;
      function loop() { state.t += reducedMotion ? 0.02 : 0.02; draw(); raf = requestAnimationFrame(loop); }
      loop();

      return function () { if (raf) cancelAnimationFrame(raf); c2d.dispose(); };
    },
  });

  // ---------- PHYSICS 4: Energy Coaster ----------
  SIMULATIONS.push({
    id: "coaster", subject: "Physics", title: "Energy Coaster", icon: "🎢",
    mount: function () {
      var c2d = LabKit.canvas2d(viewportEl);
      var state = { x: -8, v: 0, startX: -8, friction: 0, running: true };
      var g = 9.8;

      function hillHeight(x) {
        // a simple symmetric valley — guarantees the ball's natural turning
        // point (from energy conservation) always lands within the track
        // for any start in the slider's own range, so the edge-of-track
        // safety clamp below never has to intervene except exactly at the
        // extreme ends of the slider.
        return 0.04 * x * x;
      }
      function hillSlope(x) {
        var dx = 0.001;
        return (hillHeight(x + dx) - hillHeight(x - dx)) / (2 * dx);
      }

      function resetSim() {
        state.x = state.startX;
        state.v = 0;
      }

      function step(dt) {
        if (!state.running) return;
        var sub = 4, h = dt / sub;
        for (var i = 0; i < sub; i++) {
          var slope = hillSlope(state.x);
          var angle = Math.atan(slope);
          var aTangent = -g * Math.sin(angle) - state.friction * state.v;
          state.v += h * aTangent;
          var dx = (state.v * h) / Math.sqrt(1 + slope * slope);
          state.x += dx;
          // Elastic reflection only (no artificial slowdown) — real energy
          // conservation holds, this is just a safety clamp for the rare
          // case floating-point drift nudges the ball a hair past the edge.
          if (state.x < -9) { state.x = -9; state.v *= -1; }
          if (state.x > 9) { state.x = 9; state.v *= -1; }
        }
      }

      function draw() {
        var ctx = c2d.ctx, dpr = c2d.dpr(), W = c2d.canvas.width, H = c2d.canvas.height;
        ctx.clearRect(0, 0, W, H);
        var scaleX = W / 20, baseY = H * 0.88, scaleY = H * 0.14;

        function toScreen(xu, hu) { return [W / 2 + xu * scaleX, baseY - hu * scaleY]; }

        ctx.strokeStyle = "#68e7a0"; ctx.lineWidth = 4 * dpr;
        ctx.beginPath();
        for (var px = -9; px <= 9; px += 0.1) {
          var sp = toScreen(px, hillHeight(px));
          if (px === -9) ctx.moveTo(sp[0], sp[1]); else ctx.lineTo(sp[0], sp[1]);
        }
        ctx.stroke();

        var ballPos = toScreen(state.x, hillHeight(state.x));
        var grad = ctx.createRadialGradient(ballPos[0], ballPos[1], 1, ballPos[0], ballPos[1], 20 * dpr);
        grad.addColorStop(0, "rgba(255,138,168,0.6)"); grad.addColorStop(1, "rgba(255,138,168,0)");
        ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(ballPos[0], ballPos[1], 20 * dpr, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#ff8aa8"; ctx.beginPath(); ctx.arc(ballPos[0], ballPos[1], 10 * dpr, 0, Math.PI * 2); ctx.fill();

        var h = hillHeight(state.x);
        var pe = g * h, ke = 0.5 * state.v * state.v;
        var total = pe + ke;
        var barX = W - 60 * dpr, barH = H * 0.6, barY = H * 0.15;
        var maxE = 35;
        ctx.fillStyle = "rgba(255,255,255,0.08)"; ctx.fillRect(barX - 18 * dpr, barY, 36 * dpr, barH);
        var peH = Math.min(1, pe / maxE) * barH, keH = Math.min(1, ke / maxE) * barH;
        ctx.fillStyle = "#4fd1e8"; ctx.fillRect(barX - 18 * dpr, barY + barH - peH, 36 * dpr, peH);
        ctx.fillStyle = "#ffd166"; ctx.fillRect(barX - 18 * dpr, barY + barH - peH - keH, 36 * dpr, keH);

        document.getElementById("ro-pe").textContent = pe.toFixed(1);
        document.getElementById("ro-ke").textContent = ke.toFixed(1);
        document.getElementById("ro-total").textContent = total.toFixed(1);
      }

      clearPanel(readoutsEl);
      LabKit.readout(readoutsEl, "pe", "Potential energy");
      LabKit.readout(readoutsEl, "ke", "Kinetic energy");
      LabKit.readout(readoutsEl, "total", "Total energy");

      clearPanel(controlsEl);
      LabKit.slider(controlsEl, { key: "co-start", label: "Release point", min: -9, max: 9, step: 0.2, value: -8, decimals: 1, onInput: function (v) { state.startX = v; resetSim(); } });
      LabKit.slider(controlsEl, { key: "co-fric", label: "Friction", min: 0, max: 0.3, step: 0.01, value: 0, decimals: 2, onInput: function (v) { state.friction = v; } });
      LabKit.glossary(controlsEl, [
        { kind: "term", term: "Potential energy (PE)", text: "stored energy an object has because of its height — PE = mgh." },
        { kind: "term", term: "Kinetic energy (KE)", text: "energy of motion — KE = ½mv²." },
        { term: "Release point slider", text: "higher starting points store more potential energy, so the ball ends up moving faster lower down." },
        { term: "Friction slider", text: "slowly drains total energy out of the system as heat, so each pass over the track reaches a little lower." },
      ]);

      clearPanel(globalControlsEl);
      var playBtn = LabKit.button(globalControlsEl, "Pause", function () { state.running = !state.running; playBtn.textContent = state.running ? "Pause" : "Play"; }, "primary");
      LabKit.button(globalControlsEl, "Reset", resetSim);

      setFormula("PE = mgh &nbsp;|&nbsp; KE = ½mv² &nbsp;|&nbsp; Total energy stays constant without friction — it just keeps trading between the two forms.");
      setConcept("Watch the two energy bars: as the ball drops, <strong>potential energy converts to kinetic energy</strong> (it speeds up); as it climbs the far side, kinetic converts back to potential (it slows down). With friction added, a little total energy leaks out as heat on every pass.");

      resetSim();
      var raf = null, lastT = null;
      function loop(ts) {
        if (lastT === null) lastT = ts;
        var dt = Math.min((ts - lastT) / 1000, 0.05);
        lastT = ts;
        step(dt);
        draw();
        raf = requestAnimationFrame(loop);
      }
      raf = requestAnimationFrame(loop);

      return function () { if (raf) cancelAnimationFrame(raf); c2d.dispose(); };
    },
  });

  // ---------- CHEMISTRY 1: Atomic Model Explorer (3D) ----------
  SIMULATIONS.push({
    id: "atom3d", subject: "Chemistry", title: "Atomic Model Explorer", icon: "⚛️",
    uses3D: true,
    mount: function () {
      var three = LabKit.threeBoot(viewportEl);
      three.setRadius(8);
      dragHintEl.style.display = "block";

      var ELEMENTS = ["H","He","Li","Be","B","C","N","O","F","Ne","Na","Mg","Al","Si","P","S","Cl","Ar","K","Ca"];
      var group = new THREE.Group();
      three.scene.add(group);
      var electrons = [];

      function shellsFor(n) {
        var caps = [2, 8, 8, 18];
        var shells = []; var rem = n;
        for (var i = 0; i < caps.length && rem > 0; i++) {
          var take = Math.min(caps[i], rem);
          shells.push(take); rem -= take;
        }
        return shells;
      }

      function rebuild(protons) {
        while (group.children.length) group.remove(group.children[0]);
        electrons = [];

        var nucleus = new THREE.Mesh(new THREE.SphereGeometry(0.35 + protons * 0.015, 20, 20), new THREE.MeshStandardMaterial({ color: 0xffd166, emissive: 0x4a2c00, emissiveIntensity: 0.5 }));
        group.add(nucleus);

        var shells = shellsFor(protons);
        shells.forEach(function (count, shellIndex) {
          var radius = 1.1 + shellIndex * 0.9;
          var tilt = shellIndex * 0.5;
          var ringGeo = new THREE.RingGeometry(radius - 0.004, radius + 0.004, 64);
          var ring = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: 0x4fd1e8, transparent: true, opacity: 0.35, side: THREE.DoubleSide }));
          ring.rotation.x = Math.PI / 2 + tilt;
          group.add(ring);

          for (var e = 0; e < count; e++) {
            var angle0 = (e / count) * Math.PI * 2;
            var speed = 0.6 + shellIndex * 0.15;
            var dot = new THREE.Mesh(new THREE.SphereGeometry(0.1, 12, 12), new THREE.MeshStandardMaterial({ color: 0x4fd1e8, emissive: 0x08303a, emissiveIntensity: 0.6 }));
            group.add(dot);
            electrons.push({ mesh: dot, radius: radius, angle: angle0, speed: speed, tilt: tilt });
          }
        });

        var el = ELEMENTS[protons - 1] || "?";
        setFormula("Protons: <span class=\"hi\">" + protons + "</span> &nbsp;|&nbsp; Shell configuration: <span class=\"hi\">" + shells.join(", ") + "</span> &nbsp;|&nbsp; Closest match: <span class=\"hi\">" + el + "</span>");
        document.getElementById("ro-protons").textContent = protons;
        document.getElementById("ro-shells").textContent = shells.join(", ");
        document.getElementById("ro-element").textContent = el;
      }

      clearPanel(readoutsEl);
      LabKit.readout(readoutsEl, "protons", "Protons (= electrons)");
      LabKit.readout(readoutsEl, "shells", "Shell configuration");
      LabKit.readout(readoutsEl, "element", "Closest element");

      clearPanel(controlsEl);
      LabKit.slider(controlsEl, { key: "at-p", label: "Protons / electrons", min: 1, max: 20, step: 1, value: 6, onInput: function (v) { rebuild(v); } });
      LabKit.glossary(controlsEl, [
        { kind: "term", term: "Shell", text: "an energy level around the nucleus where electrons are found, each with its own maximum capacity." },
        { kind: "term", term: "Nucleus", text: "the dense central core of an atom, containing its protons and neutrons." },
        { term: "Protons/electrons slider", text: "fills shells from the inside out (2, then 8, then 8…) and changes which real element the atom resembles." },
      ]);

      setConcept("Electrons fill the <strong>innermost shell first</strong> (max 2), then the next (max 8), then the next (max 8) — that pattern of filled and half-filled outer shells is exactly what determines how reactive an element is.");
      rebuild(6);

      function loop() {
        var t = Date.now() / 1000;
        electrons.forEach(function (e) {
          var a = e.angle + t * e.speed;
          e.mesh.position.set(Math.cos(a) * e.radius, Math.sin(a) * e.radius * Math.cos(e.tilt), Math.sin(a) * e.radius * Math.sin(e.tilt));
        });
        three.tickIdleRotate();
        three.renderer.render(three.scene, three.camera);
        three.setRafId(requestAnimationFrame(loop));
      }
      loop();

      return function () { three.dispose(); dragHintEl.style.display = "none"; };
    },
  });

  // ---------- CHEMISTRY 3: States of Matter (3D particle box) ----------
  SIMULATIONS.push({
    id: "states3d", subject: "Chemistry", title: "States of Matter", icon: "🧊",
    uses3D: true,
    mount: function () {

      var N = 36;
      var particles = [];
      var group = new THREE.Group();

      for (var xi = 0; xi < side && latticePositions.length < N; xi++)
        for (var yi = 0; yi < side && latticePositions.length < N; yi++)
          for (var zi = 0; zi < side && latticePositions.length < N; zi++)
            latticePositions.push(new THREE.Vector3(

            ));

      for (var i = 0; i < N; i++) {
        var mesh = new THREE.Mesh(new THREE.SphereGeometry(0.08, 10, 10), new THREE.MeshStandardMaterial({ color: 0x68e7a0 }));
        var lat = latticePositions[i] || new THREE.Vector3(0, 0, 0);
        mesh.position.copy(lat);
        group.add(mesh);
        particles.push({
          mesh: mesh, lattice: lat.clone(),
          vel: new THREE.Vector3((Math.random() - 0.5), (Math.random() - 0.5), (Math.random() - 0.5)).multiplyScalar(0.3),
        });
      }

      var state = { temp: 20 };
      function stateLabel(t) { return t < 0 ? "Solid" : t < 100 ? "Liquid" : "Gas"; }

      function step(dt) {
        var t = state.temp;
        var speedScale = THREE.MathUtils.clamp((t + 20) / 140, 0.02, 1) * 2.2;
        var half = boxSize / 2 - 0.08;
        particles.forEach(function (p) {
          if (t < 0) {
            // solid: vibrate near lattice point
            var amp = 0.03 + (t + 20) / 20 * 0.05;
            p.mesh.position.set(
              p.lattice.x + Math.sin(Date.now() / 150 + p.lattice.x * 10) * amp,
              p.lattice.y + Math.cos(Date.now() / 170 + p.lattice.y * 10) * amp,
              p.lattice.z + Math.sin(Date.now() / 190 + p.lattice.z * 10) * amp
            );
          } else {
            p.mesh.position.addScaledVector(p.vel, dt * speedScale);
            ["x", "y", "z"].forEach(function (axis) {
              if (p.mesh.position[axis] > half) { p.mesh.position[axis] = half; p.vel[axis] *= -1; }
              if (p.mesh.position[axis] < -half) { p.mesh.position[axis] = -half; p.vel[axis] *= -1; }
            });
          }
        });
      }

      clearPanel(readoutsEl);
      LabKit.readout(readoutsEl, "state", "State of matter");
      LabKit.readout(readoutsEl, "temp", "Temperature");

      clearPanel(controlsEl);
      LabKit.slider(controlsEl, { key: "sm-t", label: "Temperature", min: -20, max: 150, step: 1, value: 20, unit: "°C", onInput: function (v) {
        state.temp = v;
        document.getElementById("ro-state").textContent = stateLabel(v);
        document.getElementById("ro-temp").textContent = v + "°C";
      } });
      document.getElementById("ro-state").textContent = stateLabel(20);
      document.getElementById("ro-temp").textContent = "20°C";
      LabKit.glossary(controlsEl, [
        { kind: "term", term: "Solid / Liquid / Gas", text: "the three common states, distinguished by how tightly packed and how fast-moving the particles are." },
        { term: "Temperature slider", text: "raises particle energy — low temperatures lock particles in place (solid), higher ones let them flow (liquid) or spread out fast (gas)." },
      ]);

      setFormula("Heating adds kinetic energy to particles — more energy means faster, wider motion, which is what actually separates solid, liquid and gas.");
      setConcept("At low temperature, particles barely vibrate in a fixed arrangement (<strong>solid</strong>). Heat them past the melting point and they break free to move around while still bunched together (<strong>liquid</strong>); heat further and they spread out and move fast enough to fill the whole container (<strong>gas</strong>).");

      function loop() {
        step(reducedMotion ? 0.008 : 0.016);
        three.tickIdleRotate();
        three.renderer.render(three.scene, three.camera);
        three.setRafId(requestAnimationFrame(loop));
      }
      loop();

      return function () { three.dispose(); dragHintEl.style.display = "none"; };
    },
  });

  // ---------- BIOLOGY 1: Photosynthesis Lab ----------
  SIMULATIONS.push({
    id: "photosynthesis", subject: "Biology", title: "Photosynthesis Lab", icon: "🍃",
    mount: function () {
      var c2d = LabKit.canvas2d(viewportEl);
      var state = { light: 70, co2: 60, bubbles: [], spawnAcc: 0 };

      function rate() {
        // limiting factor: whichever of light / CO2 is lower caps the rate
        return Math.min(state.light, state.co2) / 100 * 6; // bubbles/sec max 6
      }

      function limitingFactor() {
        return state.light < state.co2 ? "Light" : state.co2 < state.light ? "CO₂" : "Neither (balanced)";
      }

      function draw(dt) {
        var ctx = c2d.ctx, dpr = c2d.dpr(), W = c2d.canvas.width, H = c2d.canvas.height;
        ctx.clearRect(0, 0, W, H);

        // water
        ctx.fillStyle = "rgba(79,209,232,0.12)";
        ctx.fillRect(0, H * 0.15, W, H * 0.85);

        // sun indicator
        var sunR = 18 * dpr + (state.light / 100) * 22 * dpr;
        var grad = ctx.createRadialGradient(W * 0.85, H * 0.18, 1, W * 0.85, H * 0.18, sunR * 1.8);
        grad.addColorStop(0, "rgba(255,209,102," + (0.3 + state.light / 150) + ")");
        grad.addColorStop(1, "rgba(255,209,102,0)");
        ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(W * 0.85, H * 0.18, sunR * 1.8, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#ffd166"; ctx.beginPath(); ctx.arc(W * 0.85, H * 0.18, sunR, 0, Math.PI * 2); ctx.fill();

        // plant (simple leaf stalk)
        var stemX = W * 0.3, baseY = H;
        ctx.strokeStyle = "#3f7a4a"; ctx.lineWidth = 6 * dpr;
        ctx.beginPath(); ctx.moveTo(stemX, baseY); ctx.lineTo(stemX, H * 0.3); ctx.stroke();
        ctx.fillStyle = "#68e7a0";
        [[-1, 0.55], [1, 0.45], [-1, 0.35]].forEach(function (leaf) {
          ctx.beginPath();
          ctx.ellipse(stemX + leaf[0] * 50 * dpr, H * leaf[1], 42 * dpr, 20 * dpr, leaf[0] * 0.5, 0, Math.PI * 2);
          ctx.fill();
        });

        // spawn bubbles
        state.spawnAcc += dt * rate();
        while (state.spawnAcc >= 1) {
          state.bubbles.push({ x: stemX + (Math.random() - 0.5) * 70 * dpr, y: H * 0.4, r: (3 + Math.random() * 3) * dpr, vy: (20 + Math.random() * 20) * dpr });
          state.spawnAcc -= 1;
        }
        state.bubbles.forEach(function (b) { b.y -= b.vy * dt; });
        state.bubbles = state.bubbles.filter(function (b) { return b.y > -10; });
        ctx.fillStyle = "rgba(255,255,255,0.75)";
        ctx.strokeStyle = "rgba(255,255,255,0.9)"; ctx.lineWidth = 1 * dpr;
        state.bubbles.forEach(function (b) {
          ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        });

        document.getElementById("ro-rate").textContent = rate().toFixed(1) + " /s";
        document.getElementById("ro-limit").textContent = limitingFactor();
      }

      clearPanel(readoutsEl);
      LabKit.readout(readoutsEl, "rate", "O₂ bubble rate");
      LabKit.readout(readoutsEl, "limit", "Limiting factor");

      clearPanel(controlsEl);
      LabKit.slider(controlsEl, { key: "ph-light", label: "Light intensity", min: 0, max: 100, step: 1, value: 70, unit: "%", onInput: function (v) { state.light = v; } });
      LabKit.slider(controlsEl, { key: "ph-co2", label: "CO₂ level", min: 0, max: 100, step: 1, value: 60, unit: "%", onInput: function (v) { state.co2 = v; } });
      LabKit.glossary(controlsEl, [
        { kind: "term", term: "Photosynthesis", text: "the process plants use to turn light, water and CO₂ into food (glucose) and oxygen." },
        { kind: "term", term: "Limiting factor", text: "whichever ingredient is scarcest right now — it's the one holding back the whole reaction." },
        { term: "Light intensity slider", text: "more light speeds up photosynthesis, but only if CO₂ isn't the scarcer ingredient." },
        { term: "CO₂ level slider", text: "same idea in reverse — extra CO₂ only helps if light isn't the bottleneck." },
      ]);

      setFormula("CO₂ + H₂O + light (chlorophyll) → glucose + O₂ &nbsp;—&nbsp; the O₂ bubbles are the visible byproduct of this reaction.");
      setConcept("<strong>Limiting factor principle:</strong> photosynthesis speeds up with more light AND more CO₂ — but only up to whichever one is scarcer. Raising the plentiful factor further does nothing until the scarce one improves too.");

      var raf = null, lastT = null;
      function loop(ts) {
        if (lastT === null) lastT = ts;
        var dt = Math.min((ts - lastT) / 1000, 0.05);
        lastT = ts;
        draw(dt);
        raf = requestAnimationFrame(loop);
      }
      raf = requestAnimationFrame(loop);

      return function () { if (raf) cancelAnimationFrame(raf); c2d.dispose(); };
    },
  });

  // ---------- MATH 5: Venn Diagram Explorer ----------
  SIMULATIONS.push({
    id: "venn", subject: "Math", title: "Venn Diagram Explorer", icon: "◯",
    mount: function () {
      var c2d = LabKit.canvas2d(viewportEl);
      var state = { a: 15, b: 12, overlap: 5 };

      function draw() {
        var ctx = c2d.ctx, dpr = c2d.dpr(), W = c2d.canvas.width, H = c2d.canvas.height;
        ctx.clearRect(0, 0, W, H);
        var ov = Math.min(state.overlap, state.a, state.b);
        var rA = Math.sqrt(state.a) * 10 * dpr, rB = Math.sqrt(state.b) * 10 * dpr;
        var maxOv = Math.min(state.a, state.b);
        var sepFrac = maxOv > 0 ? 1 - ov / maxOv : 1;
        var sep = (rA + rB) * 0.15 + sepFrac * (rA + rB) * 0.55;
        var cx = W / 2, cy = H / 2;
        var ax = cx - sep / 2, bx = cx + sep / 2;

        ctx.globalAlpha = 0.35;
        ctx.fillStyle = "#b794f6"; ctx.beginPath(); ctx.arc(ax, cy, rA, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#4fd1e8"; ctx.beginPath(); ctx.arc(bx, cy, rB, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
        ctx.strokeStyle = "#b794f6"; ctx.lineWidth = 2.5 * dpr; ctx.beginPath(); ctx.arc(ax, cy, rA, 0, Math.PI * 2); ctx.stroke();
        ctx.strokeStyle = "#4fd1e8"; ctx.beginPath(); ctx.arc(bx, cy, rB, 0, Math.PI * 2); ctx.stroke();

        ctx.fillStyle = "#e7ecf4"; ctx.font = (14 * dpr) + "px 'Nunito', sans-serif"; ctx.textAlign = "center";
        ctx.fillText("A: " + state.a, ax - rA * 0.5, cy - rA - 10 * dpr);
        ctx.fillText("B: " + state.b, bx + rB * 0.5, cy - rB - 10 * dpr);
        ctx.fillText(String(ov), cx, cy + 4 * dpr);

        document.getElementById("ro-union").textContent = (state.a + state.b - ov);
        document.getElementById("ro-aonly").textContent = (state.a - ov);
        document.getElementById("ro-bonly").textContent = (state.b - ov);
        setFormula("n(A ∪ B) = n(A) + n(B) − n(A ∩ B) = " + state.a + " + " + state.b + " − " + ov + " = <span class=\"hi\">" + (state.a + state.b - ov) + "</span>");
      }

      clearPanel(readoutsEl);
      LabKit.readout(readoutsEl, "union", "n(A∪B)");
      LabKit.readout(readoutsEl, "aonly", "A only");
      LabKit.readout(readoutsEl, "bonly", "B only");

      clearPanel(controlsEl);
      LabKit.slider(controlsEl, { key: "vn-a", label: "n(A)", min: 5, max: 30, step: 1, value: 15, onInput: function (v) { state.a = v; state.overlap = Math.min(state.overlap, v, state.b); draw(); } });
      LabKit.slider(controlsEl, { key: "vn-b", label: "n(B)", min: 5, max: 30, step: 1, value: 12, onInput: function (v) { state.b = v; state.overlap = Math.min(state.overlap, v, state.a); draw(); } });
      LabKit.slider(controlsEl, { key: "vn-ov", label: "n(A∩B)", min: 0, max: 30, step: 1, value: 5, onInput: function (v) { state.overlap = v; draw(); } });
      LabKit.glossary(controlsEl, [
        { kind: "term", term: "Union (A∪B)", text: "everything in A, in B, or in both — counted once each." },
        { kind: "term", term: "Intersection (A∩B)", text: "only the elements that are in both A and B." },
        { term: "n(A∩B) slider", text: "can never exceed the smaller of n(A) and n(B) — you can't overlap more than the smaller set contains." },
      ]);

      setConcept("The overlap region is counted only <strong>once</strong> in the union — that's exactly why the formula subtracts n(A∩B); without it, the shared elements would be double-counted.");
      draw();
      return function () { c2d.dispose(); };
    },
  });

  // ---------- MATH 6: Linear Equation Balance ----------
  SIMULATIONS.push({
    id: "eqbalance", subject: "Math", title: "Equation Balance Scale", icon: "⚖️",
    mount: function () {
      var c2d = LabKit.canvas2d(viewportEl);
      var state = { x: 0 };
      var a = 3, b = 2, c = 14; // 3x + 2 = 14, solution x = 4

      function draw() {
        var ctx = c2d.ctx, dpr = c2d.dpr(), W = c2d.canvas.width, H = c2d.canvas.height;
        ctx.clearRect(0, 0, W, H);
        var lhs = a * state.x + b;
        var diff = lhs - c;
        var tilt = Math.max(-0.35, Math.min(0.35, diff * 0.03));

        var pivotX = W / 2, pivotY = H * 0.45, beamLen = W * 0.34;
        ctx.save();
        ctx.translate(pivotX, pivotY);
        ctx.rotate(tilt);
        ctx.strokeStyle = "#9aa0c7"; ctx.lineWidth = 5 * dpr;
        ctx.beginPath(); ctx.moveTo(-beamLen, 0); ctx.lineTo(beamLen, 0); ctx.stroke();

        function pan(px, label) {
          ctx.strokeStyle = "#5d6391"; ctx.lineWidth = 2 * dpr;
          ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, 50 * dpr); ctx.stroke();
          ctx.fillStyle = "#141a3f"; ctx.strokeStyle = "#b794f6"; ctx.lineWidth = 2 * dpr;
          ctx.beginPath(); ctx.ellipse(px, 50 * dpr, 46 * dpr, 14 * dpr, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          ctx.fillStyle = "#e7ecf4"; ctx.font = (14 * dpr) + "px 'IBM Plex Mono', monospace"; ctx.textAlign = "center";
          ctx.fillText(label, px, 54 * dpr);
        }
        pan(-beamLen * 0.7, "3x + 2 = " + lhs.toFixed(0));
        pan(beamLen * 0.7, "= " + c);
        ctx.restore();

        ctx.fillStyle = "#9aa0c7"; ctx.beginPath(); ctx.moveTo(pivotX - 10 * dpr, pivotY); ctx.lineTo(pivotX + 10 * dpr, pivotY); ctx.lineTo(pivotX, pivotY + 18 * dpr); ctx.fill();

        document.getElementById("ro-lhs").textContent = lhs.toFixed(0);
        document.getElementById("ro-status").textContent = diff === 0 ? "Balanced!" : diff > 0 ? "Too heavy (LHS)" : "Too light (LHS)";
        setFormula("3x + 2 = 14 &nbsp;→&nbsp; solve for x: <span class=\"hi\">x = " + ((c - b) / a).toFixed(0) + "</span>");
      }

      clearPanel(readoutsEl);
      LabKit.readout(readoutsEl, "lhs", "Left side value");
      LabKit.readout(readoutsEl, "status", "Scale status");

      clearPanel(controlsEl);
      LabKit.slider(controlsEl, { key: "eq-x", label: "x", min: -2, max: 10, step: 0.5, value: 0, decimals: 1, onInput: function (v) { state.x = v; draw(); } });
      LabKit.glossary(controlsEl, [
        { kind: "term", term: "Balanced equation", text: "both sides of the = sign have exactly the same value." },
        { term: "x slider", text: "changes the left side's value — the scale levels out only at the one value of x that makes both sides equal." },
      ]);

      setConcept("An equation is just a <strong>balance scale</strong> — whatever you do to one side (add, subtract, multiply), you must do to the other to keep it level. Slide x until the beam is perfectly flat.");
      draw();
      return function () { c2d.dispose(); };
    },
  });

  // ---------- PHYSICS 5: Projectile Motion ----------
  SIMULATIONS.push({
    id: "projectile", subject: "Physics", title: "Projectile Motion", icon: "🏀",
    mount: function () {
      var c2d = LabKit.canvas2d(viewportEl);
      var g = 9.8;
      var state = { v0: 20, angle: 45, t: 0, flying: true };

      function flightTime() { var vy = state.v0 * Math.sin((state.angle * Math.PI) / 180); return (2 * vy) / g; }
      function range() { var vx = state.v0 * Math.cos((state.angle * Math.PI) / 180); return vx * flightTime(); }
      function maxHeight() { var vy = state.v0 * Math.sin((state.angle * Math.PI) / 180); return (vy * vy) / (2 * g); }
      function posAt(t) {
        var rad = (state.angle * Math.PI) / 180;
        var vx = state.v0 * Math.cos(rad), vy = state.v0 * Math.sin(rad);
        return { x: vx * t, y: vy * t - 0.5 * g * t * t };
      }

      function draw() {
        var ctx = c2d.ctx, dpr = c2d.dpr(), W = c2d.canvas.width, H = c2d.canvas.height;
        ctx.clearRect(0, 0, W, H);
        var groundY = H * 0.85;
        ctx.strokeStyle = "#5d6391"; ctx.lineWidth = 2 * dpr;
        ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(W, groundY); ctx.stroke();

        var R = Math.max(range(), 1);
        var scale = (W * 0.85) / R;
        var originX = W * 0.06;

        ctx.strokeStyle = "rgba(79,209,232,0.5)"; ctx.lineWidth = 2 * dpr;
        ctx.beginPath();
        var tf = flightTime();
        for (var tt = 0; tt <= tf; tt += tf / 60) {
          var p = posAt(tt);
          var sx = originX + p.x * scale, sy = groundY - p.y * scale;
          if (tt === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
        }
        ctx.stroke();

        var cur = posAt(Math.min(state.t, tf));
        var cx = originX + cur.x * scale, cy = groundY - cur.y * scale;
        ctx.fillStyle = "#ffd166"; ctx.beginPath(); ctx.arc(cx, cy, 8 * dpr, 0, Math.PI * 2); ctx.fill();

        document.getElementById("ro-range").textContent = range().toFixed(1) + " m";
        document.getElementById("ro-height").textContent = maxHeight().toFixed(1) + " m";
        document.getElementById("ro-time").textContent = tf.toFixed(2) + " s";
      }

      clearPanel(readoutsEl);
      LabKit.readout(readoutsEl, "range", "Range");
      LabKit.readout(readoutsEl, "height", "Max height");
      LabKit.readout(readoutsEl, "time", "Flight time");

      clearPanel(controlsEl);
      LabKit.slider(controlsEl, { key: "pj-v", label: "Launch speed", min: 5, max: 40, step: 1, value: 20, unit: " m/s", onInput: function (v) { state.v0 = v; state.t = 0; draw(); } });
      LabKit.slider(controlsEl, { key: "pj-a", label: "Launch angle", min: 10, max: 80, step: 1, value: 45, unit: "°", onInput: function (v) { state.angle = v; state.t = 0; draw(); } });
      LabKit.glossary(controlsEl, [
        { kind: "term", term: "Range", text: "the horizontal distance the projectile travels before landing." },
        { kind: "term", term: "Trajectory", text: "the curved (parabolic) path traced by any launched object under gravity alone." },
        { term: "Launch angle slider", text: "45° gives the longest range for a given speed — steeper or flatter angles both land shorter." },
      ]);

      setFormula("Range = v₀²sin(2θ)/g &nbsp;|&nbsp; Max height = (v₀sinθ)²/2g");
      setConcept("Horizontal and vertical motion happen <strong>independently</strong> — gravity only ever slows/speeds the vertical part, while the horizontal speed never changes (ignoring air resistance). That's why the path is always a smooth, symmetric curve.");

      var raf = null, lastT = null;
      function loop(ts) {
        if (lastT === null) lastT = ts;
        var dt = Math.min((ts - lastT) / 1000, 0.05);
        lastT = ts;
        if (!reducedMotion) {
          state.t += dt;
          if (state.t > flightTime()) state.t = 0;
        }
        draw();
        raf = requestAnimationFrame(loop);
      }
      raf = requestAnimationFrame(loop);

      return function () { if (raf) cancelAnimationFrame(raf); c2d.dispose(); };
    },
  });

        glow.addColorStop(0, "rgba(255,138,168," + (0.3 + state.heat / 150) + ")"); glow.addColorStop(1, "rgba(255,138,168,0)");

        document.getElementById("ro-newlen").textContent = newLength().toFixed(5) + " m";
        document.getElementById("ro-extra").textContent = ((newLength() - L0) * 1000).toFixed(3) + " mm";
        setFormula("New length = L₀(1 + αΔT) = " + L0 + "(1 + " + alpha + " × " + state.deltaT + ") = <span class=\"hi\">" + newLength().toFixed(5) + "</span> m");
      }

      clearPanel(readoutsEl);
      LabKit.readout(readoutsEl, "newlen", "New length");
      LabKit.readout(readoutsEl, "extra", "Expansion amount");

        { kind: "term", term: "α (expansion coefficient)", text: "how much a specific material expands per degree of temperature rise — different for every material." },

      return function () { c2d.dispose(); };
    },
  });

  // ---------- PHYSICS 10: Echo Distance Calculator ----------
  SIMULATIONS.push({
    id: "echo", subject: "Physics", title: "Echo Distance Calculator", icon: "🗣️",
    mount: function () {
      var c2d = LabKit.canvas2d(viewportEl);
      var soundSpeed = 340;
      var state = { time: 0.6, pulse: 0 };

        var ctx = c2d.ctx, dpr = c2d.dpr(), W = c2d.canvas.width, H = c2d.canvas.height;

        ctx.fillStyle = "#9aa0c7"; ctx.fillRect(wallX, y - 60 * dpr, 14 * dpr, 120 * dpr);

        var px = 20 * dpr + prog * (wallX - 20 * dpr);
        if (prog < 0.5) px = 20 * dpr + (prog * 2) * (wallX - 20 * dpr);
        else px = wallX - ((prog - 0.5) * 2) * (wallX - 20 * dpr);
        ctx.fillStyle = "#4fd1e8"; ctx.beginPath(); ctx.arc(px, y, 5 * dpr, 0, Math.PI * 2); ctx.fill();

        ctx.fillStyle = "#e7ecf4"; ctx.font = (13 * dpr) + "px 'IBM Plex Mono', monospace"; ctx.textAlign = "center";

        document.getElementById("ro-dist").textContent = d.toFixed(1) + " m";

      }

        { term: "Time slider", text: "the sound makes a round trip, so only HALF the total time×speed gives the actual one-way distance to the wall." },
      ]);

      setConcept("The round-trip rule is the whole trick here: sound travels <strong>to the wall and back</strong> in the measured time, so dividing by 2 after multiplying speed × time gives the true one-way distance — exactly how SONAR finds underwater distances.");

    id: "rust", subject: "Chemistry", title: "Rust Formation Timelapse", icon: "🔩",
    mount: function () {
      var c2d = LabKit.canvas2d(viewportEl);
      var state = { humidity: 60, time: 0 };

      function rustFraction() {
        var rate = (state.humidity / 100) * 0.0004;
        return Math.min(1, state.time * rate);
      }

      function draw() {
        var ctx = c2d.ctx, dpr = c2d.dpr(), W = c2d.canvas.width, H = c2d.canvas.height;
        ctx.clearRect(0, 0, W, H);
        var nailX = W * 0.3, nailY = H * 0.2, nailW = W * 0.1, nailH = H * 0.6;
        var frac = rustFraction();

        ctx.fillStyle = "#9aa0c7"; ctx.fillRect(nailX, nailY, nailW, nailH);
        ctx.fillStyle = "rgba(224,106,61,0.85)"; ctx.fillRect(nailX, nailY + nailH * (1 - frac), nailW, nailH * frac);

        document.getElementById("ro-rust").textContent = (frac * 100).toFixed(0) + "%";
        setFormula("Iron + Oxygen + Water (moisture) → Iron oxide (rust) — a slow oxidation reaction, not instant like burning.");
      }

      clearPanel(readoutsEl);
      LabKit.readout(readoutsEl, "rust", "Rusted so far");

      clearPanel(controlsEl);
      LabKit.slider(controlsEl, { key: "ru-h", label: "Humidity", min: 10, max: 100, step: 1, value: 60, unit: "%", onInput: function (v) { state.humidity = v; } });
      LabKit.glossary(controlsEl, [
        { kind: "term", term: "Rusting", text: "a chemical change where iron reacts slowly with oxygen and moisture to form iron oxide." },
        { kind: "term", term: "Oxidation", text: "any reaction where a substance combines with oxygen — rusting and burning are both oxidation, just at very different speeds." },
        { term: "Humidity slider", text: "more moisture in the air speeds up rusting dramatically — that's why dry climates see far less rust." },
      ]);

      setConcept("Rusting <strong>gains</strong> mass rather than losing it — the iron is chemically combining with oxygen from the air, not wearing away. It's the exact same basic reaction as burning, just stretched out over months instead of seconds.");

      var raf = null, lastT = null;
      function loop(ts) {
        if (lastT === null) lastT = ts;
        var dt = (ts - lastT); lastT = ts;
        state.time += reducedMotion ? 0 : dt;
        draw();
        raf = requestAnimationFrame(loop);
      }
      raf = requestAnimationFrame(loop);

      return function () { if (raf) cancelAnimationFrame(raf); c2d.dispose(); };
    },
  });

  // ---------- CHEMISTRY 10b: Combustion & Products ----------
  SIMULATIONS.push({
    id: "combustion", subject: "Chemistry", title: "Combustion & Products", icon: "🕯️",
    mount: function () {
      var c2d = LabKit.canvas2d(viewportEl);
      var state = { o2: 70, t: 0 };

      function draw(dt) {
        var ctx = c2d.ctx, dpr = c2d.dpr(), W = c2d.canvas.width, H = c2d.canvas.height;
        ctx.clearRect(0, 0, W, H);
        var cx = W / 2, baseY = H * 0.75;
        var flameSize = (20 + (state.o2 / 100) * 50) * dpr;

        ctx.fillStyle = "#9aa0c7"; ctx.fillRect(cx - 4 * dpr, baseY, 8 * dpr, 40 * dpr);

        var flicker = Math.sin(state.t * 8) * 4 * dpr;
        ctx.beginPath();
        ctx.moveTo(cx, baseY - flameSize - flicker);
        ctx.quadraticCurveTo(cx + flameSize * 0.6, baseY - flameSize * 0.4, cx, baseY);
        ctx.quadraticCurveTo(cx - flameSize * 0.6, baseY - flameSize * 0.4, cx, baseY - flameSize - flicker);
        var grad = ctx.createLinearGradient(cx, baseY, cx, baseY - flameSize);
        grad.addColorStop(0, "#ff8aa8"); grad.addColorStop(0.6, "#ffd166"); grad.addColorStop(1, "rgba(255,209,102,0.2)");
        ctx.fillStyle = grad; ctx.fill();

        if (state.o2 < 40) {
          ctx.fillStyle = "rgba(90,90,100,0.5)";
          for (var i = 0; i < 4; i++) {
            ctx.beginPath(); ctx.arc(cx + Math.sin(state.t + i) * 10 * dpr, baseY - flameSize - 20 * dpr - i * 14 * dpr, (6 + i * 2) * dpr, 0, Math.PI * 2); ctx.fill();
          }
        }

        document.getElementById("ro-flame").textContent = state.o2 > 60 ? "Complete combustion" : "Incomplete (soot forms)";
      }

      clearPanel(readoutsEl);
      LabKit.readout(readoutsEl, "flame", "Combustion type");

      clearPanel(controlsEl);
      LabKit.slider(controlsEl, { key: "co-o2", label: "Oxygen supply", min: 10, max: 100, step: 1, value: 70, unit: "%", onInput: function (v) { state.o2 = v; } });
      LabKit.glossary(controlsEl, [
        { kind: "term", term: "Combustion", text: "a chemical change that releases heat and light, producing new substances like CO₂ and water vapour." },
        { kind: "term", term: "Incomplete combustion", text: "happens with too little oxygen — produces soot (carbon) and dangerous carbon monoxide instead of clean CO₂." },
        { term: "Oxygen slider", text: "below a threshold, the flame starts producing visible black soot — a sign the fuel isn't fully burning." },
      ]);

      setFormula("Complete: Fuel + plenty O₂ → CO₂ + H₂O + heat + light. Incomplete: Fuel + too little O₂ → soot (C) + CO + heat.");
      setConcept("A candle flame needs <strong>enough oxygen</strong> to burn completely and cleanly — starve it of oxygen and it still burns, but produces soot and carbon monoxide instead, which is exactly why poorly ventilated fires are dangerous.");

      var raf = null, lastT = null;
      function loop(ts) {
        if (lastT === null) lastT = ts;
        var dt = Math.min((ts - lastT) / 1000, 0.05);
        lastT = ts;
        state.t += reducedMotion ? 0 : dt;
        draw(dt);
        raf = requestAnimationFrame(loop);
      }
      raf = requestAnimationFrame(loop);

      return function () { if (raf) cancelAnimationFrame(raf); c2d.dispose(); };
    },
  });

  // ---------- CHEMISTRY 12: Solutions & Saturation ----------
  SIMULATIONS.push({
    id: "saturation", subject: "Chemistry", title: "Solutions & Saturation", icon: "🧂",
    mount: function () {
      var c2d = LabKit.canvas2d(viewportEl);
      var state = { added: 20, temp: 25 };

      function maxSolubleAt(temp) { return 30 + temp * 0.6; }

      function draw() {
        var ctx = c2d.ctx, dpr = c2d.dpr(), W = c2d.canvas.width, H = c2d.canvas.height;
        ctx.clearRect(0, 0, W, H);
        var cap = maxSolubleAt(state.temp);
        var dissolved = Math.min(state.added, cap);
        var undissolved = Math.max(0, state.added - cap);

        var glassX = W * 0.35, glassY = H * 0.2, glassW = W * 0.3, glassH = H * 0.6;
        ctx.strokeStyle = "#9aa0c7"; ctx.lineWidth = 2 * dpr;
        ctx.strokeRect(glassX, glassY, glassW, glassH);
        ctx.fillStyle = "rgba(79,209,232,0.25)"; ctx.fillRect(glassX, glassY + glassH * 0.15, glassW, glassH * 0.85);

        var pileH = Math.min(glassH * 0.3, (undissolved / 40) * glassH * 0.3);
        ctx.fillStyle = "#e7ecf4"; ctx.fillRect(glassX, glassY + glassH - pileH, glassW, pileH);

        document.getElementById("ro-dissolved").textContent = dissolved.toFixed(0) + " g";
        document.getElementById("ro-undissolved").textContent = undissolved.toFixed(0) + " g";
        document.getElementById("ro-sat").textContent = state.added >= cap ? "Saturated" : "Unsaturated";
        setFormula("Maximum soluble at " + state.temp + "°C ≈ <span class=\"hi\">" + cap.toFixed(0) + "</span> g — warmer water dissolves more.");
      }

      clearPanel(readoutsEl);
      LabKit.readout(readoutsEl, "dissolved", "Dissolved");
      LabKit.readout(readoutsEl, "undissolved", "Undissolved (settled)");
      LabKit.readout(readoutsEl, "sat", "Status");

      clearPanel(controlsEl);
      LabKit.slider(controlsEl, { key: "sa-add", label: "Sugar added", min: 0, max: 80, step: 1, value: 20, unit: " g", onInput: function (v) { state.added = v; draw(); } });
      LabKit.slider(controlsEl, { key: "sa-temp", label: "Water temperature", min: 0, max: 90, step: 1, value: 25, unit: "°C", onInput: function (v) { state.temp = v; draw(); } });
      LabKit.glossary(controlsEl, [
        { kind: "term", term: "Saturated solution", text: "holds the maximum amount of solute the solvent can dissolve at that temperature — any more just settles, undissolved." },
        { term: "Temperature slider", text: "raises the solvent's dissolving capacity — the same water can hold more sugar once it's warmer." },
      ]);

      setConcept("If stirring longer isn't dissolving more sugar, the solution is probably already <strong>saturated</strong> at that temperature — the fix is more water or more heat, not more stirring.");
      draw();
      return function () { c2d.dispose(); };
    },
  });

  // ============================================================
  // Shell wiring: sidebar + mount/unmount lifecycle
  // ============================================================
  var activeDispose = null;
  var activeId = null;

  function renderSidebar() {
    sidebarEl.innerHTML = "";
    var bySubject = {};
    SIMULATIONS.forEach(function (s) { (bySubject[s.subject] = bySubject[s.subject] || []).push(s); });
    ["Math", "Physics", "Chemistry", "Biology", "Geography", "History"].forEach(function (subj) {
      if (!bySubject[subj]) return;
      var label = LabKit.el("div", "group-label", subj);
      sidebarEl.appendChild(label);
      bySubject[subj].forEach(function (s) {
        var btn = LabKit.el("button", "sim-btn" + (s.id === activeId ? " active" : ""));
        btn.innerHTML = '<span class="dot" style="background:' + SUBJECT_COLOR[subj] + '"></span><span class="ic">' + s.icon + '</span><span>' + s.title + '</span>';
        btn.addEventListener("click", function () { mountSim(s.id); });
        sidebarEl.appendChild(btn);
      });
    });
  }

  function mountSim(id) {
    var sim = SIMULATIONS.filter(function (s) { return s.id === id; })[0];
    if (!sim) return;
    if (activeDispose) { try { activeDispose(); } catch (e) {} activeDispose = null; }
    activeId = id;
    dragHintEl.style.display = "none";
    subjectChipEl.textContent = sim.subject;
    subjectChipEl.style.color = SUBJECT_COLOR[sim.subject];
    subjectChipEl.style.borderColor = SUBJECT_COLOR[sim.subject];
    simTitleEl.textContent = sim.title;
    clearPanel(globalControlsEl);
    activeDispose = sim.mount();
    renderSidebar();
  }

  renderSidebar();
  mountSim(SIMULATIONS[0].id);
})();
