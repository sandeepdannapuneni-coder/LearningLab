        ctx.beginPath(); ctx.moveTo(cx - W * 0.4, cy); ctx.lineTo(cx + W * 0.4, cy); ctx.stroke();

        ctx.strokeStyle = state.kind === "convex" ? "#4fd1e8" : "#ff8aa8"; ctx.lineWidth = 4 * dpr;
        ctx.beginPath();
        if (state.kind === "convex") {
          ctx.ellipse(cx, cy, 18 * dpr, H * 0.3, 0, 0, Math.PI * 2);
        } else {
          ctx.moveTo(cx - 10 * dpr, cy - H * 0.3); ctx.quadraticCurveTo(cx + 15 * dpr, cy, cx - 10 * dpr, cy + H * 0.3);
          ctx.moveTo(cx + 10 * dpr, cy - H * 0.3); ctx.quadraticCurveTo(cx - 15 * dpr, cy, cx + 10 * dpr, cy + H * 0.3);
        }
        ctx.stroke();

        var objX = cx - Math.min(W * 0.35, state.u * 5 * dpr);
        ctx.fillStyle = "#ffd166"; ctx.beginPath(); ctx.arc(objX, cy - 40 * dpr, 7 * dpr, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#e7ecf4"; ctx.font = (11 * dpr) + "px 'Nunito', sans-serif"; ctx.textAlign = "center";

        document.getElementById("ro-size").textContent = c.size;
        document.getElementById("ro-use").textContent = c.use;
        setFormula(state.kind === "convex"
          ? "Object distance (u = " + state.u + ") vs focal length (F = " + F + "): " + (state.u > 2 * F ? "u &gt; 2F" : state.u > F ? "F &lt; u &lt; 2F" : "u &lt; F") + " &nbsp;→&nbsp; <span class=\"hi\">" + c.nature + ", " + c.orient + ", " + c.size + "</span>"
          : "A concave lens always produces a <span class=\"hi\">Virtual, Erect, Diminished</span> image, no matter the object distance.");
      }

      clearPanel(readoutsEl);
      LabKit.readout(readoutsEl, "nature", "Image: Real or Virtual?");
      LabKit.readout(readoutsEl, "orient", "Orientation");
      LabKit.readout(readoutsEl, "size", "Size");
      LabKit.readout(readoutsEl, "use", "Real-world use");

      clearPanel(controlsEl);
      LabKit.slider(controlsEl, { key: "ln-u", label: "Object distance (u) — convex lens only", min: 2, max: 45, step: 1, value: 35, onInput: function (v) { state.u = v; draw(); } });
      LabKit.glossary(controlsEl, [
        { kind: "term", term: "Convex lens", text: "thicker in the middle than at the edges — converges light, able to form both real and virtual images depending on distance." },
        { kind: "term", term: "Concave lens", text: "thinner in the middle than at the edges — always diverges light, producing only virtual, smaller images." },
        { kind: "term", term: "Focal length (F)", text: "the distance from the lens at which parallel rays converge to a point." },
        { term: "Object distance slider", text: "move the object inside the focal length and the SAME convex lens suddenly acts like a magnifying glass instead of a camera lens." },
      ]);

      clearPanel(globalControlsEl);
      var convexBtn = LabKit.button(globalControlsEl, "Convex", function () { state.kind = "convex"; convexBtn.classList.add("active"); concaveBtn.classList.remove("active"); draw(); }, "chip active");

      setConcept("A single convex lens can act as a <strong>camera lens, a projector lens, or a magnifying glass</strong> — the exact same piece of glass, just used at a different distance from the object. A concave lens never gets this flexibility; it only ever spreads light out.");
      draw();
      return function () { c2d.dispose(); };
    },
  });

  SIMULATIONS.push({
    id: "wavespeed", subject: "Physics", title: "Wave Speed Explorer", icon: "🌊",
    mount: function () {
      var c2d = LabKit.canvas2d(viewportEl);
      var state = { frequency: 5, wavelength: 2, t: 0 };

      function draw(dt) {
        var ctx = c2d.ctx, dpr = c2d.dpr(), W = c2d.canvas.width, H = c2d.canvas.height;
        ctx.clearRect(0, 0, W, H);
        var cy = H / 2, amp = H * 0.2;
        var pxPerM = W / 10;
        var speed = state.frequency * state.wavelength;

        ctx.strokeStyle = "#4fd1e8"; ctx.lineWidth = 3 * dpr;
        ctx.beginPath();
        for (var x = 0; x <= W; x += 2 * dpr) {
          var xm = x / pxPerM;
          var y = cy + Math.sin((2 * Math.PI / state.wavelength) * xm - 2 * Math.PI * state.frequency * state.t) * amp;
          if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();

        var waveLenPx = state.wavelength * pxPerM;
        ctx.strokeStyle = "rgba(255,255,255,0.4)"; ctx.lineWidth = 1.5 * dpr;
        ctx.beginPath(); ctx.moveTo(20 * dpr, cy - amp - 16 * dpr); ctx.lineTo(20 * dpr + waveLenPx, cy - amp - 16 * dpr); ctx.stroke();
        ctx.fillStyle = "#e7ecf4"; ctx.font = (11 * dpr) + "px 'Nunito', sans-serif"; ctx.textAlign = "center";
        ctx.fillText("1 wavelength (λ = " + state.wavelength + " m)", 20 * dpr + waveLenPx / 2, cy - amp - 24 * dpr);

        document.getElementById("ro-speed").textContent = speed.toFixed(1) + " m/s";
        document.getElementById("ro-period").textContent = (1 / state.frequency).toFixed(3) + " s";
        setFormula("v = f × λ = " + state.frequency + " × " + state.wavelength + " = <span class=\"hi\">" + speed.toFixed(1) + " m/s</span>");
      }

      clearPanel(readoutsEl);
      LabKit.readout(readoutsEl, "speed", "Wave speed");
      LabKit.readout(readoutsEl, "period", "Period (time for 1 cycle)");

      clearPanel(controlsEl);
      LabKit.slider(controlsEl, { key: "wv-f", label: "Frequency", min: 1, max: 20, step: 0.5, value: 5, decimals: 1, unit: " Hz", onInput: function (v) { state.frequency = v; } });
      LabKit.slider(controlsEl, { key: "wv-l", label: "Wavelength", min: 0.5, max: 5, step: 0.1, value: 2, decimals: 1, unit: " m", onInput: function (v) { state.wavelength = v; } });
      LabKit.glossary(controlsEl, [
        { kind: "term", term: "Wavelength (λ)", text: "the distance between one point on a wave and the next identical point — like crest to crest." },
        { kind: "term", term: "Frequency (f)", text: "how many complete wave cycles pass a point every second, measured in hertz (Hz)." },
        { kind: "term", term: "Period", text: "the time taken for one complete wave cycle — the inverse of frequency." },
        { term: "Frequency slider", text: "raise the frequency while keeping wavelength fixed and the wave speed itself increases — frequency and wavelength both independently control speed." },
      ]);

      setConcept("Every wave obeys <strong>v = fλ</strong> — speed equals frequency times wavelength. This single relationship works for sound, light, water ripples, and radio waves alike, even though those waves are physically completely different.");

      var raf = null, lastT = null;
      function loop(ts) {
        if (lastT === null) lastT = ts;

      return function () { if (raf) cancelAnimationFrame(raf); c2d.dispose(); };
    },
  });

        var ctx = c2d.ctx, dpr = c2d.dpr(), W = c2d.canvas.width, H = c2d.canvas.height;
        ctx.clearRect(0, 0, W, H);
        var cx = W / 2, baseY = H * 0.75;
        var flameSize = (20 + (state.o2 / 100) * 50) * dpr;
        var colors = FUELS[state.fuel].colors;

        ctx.moveTo(cx, baseY - flameSize - flicker);
        ctx.quadraticCurveTo(cx + flameSize * 0.6, baseY - flameSize * 0.4, cx, baseY);
        ctx.quadraticCurveTo(cx - flameSize * 0.6, baseY - flameSize * 0.4, cx, baseY - flameSize - flicker);
        var grad = ctx.createLinearGradient(cx, baseY, cx, baseY - flameSize);
        grad.addColorStop(0, colors[0]); grad.addColorStop(0.6, colors[1]); grad.addColorStop(1, colors[2]);

        if (state.o2 < 40) {
          ctx.fillStyle = "rgba(90,90,100,0.5)";
          for (var i = 0; i < 4; i++) {
            ctx.beginPath(); ctx.arc(cx + Math.sin(state.t + i) * 10 * dpr, baseY - flameSize - 20 * dpr - i * 14 * dpr, (6 + i * 2) * dpr, 0, Math.PI * 2); ctx.fill();

      LabKit.readout(readoutsEl, "use", "Common use of this fuel");

      clearPanel(controlsEl);

        { kind: "term", term: "Incomplete combustion", text: "happens with too little oxygen — produces soot (carbon) and dangerous carbon monoxide instead of clean CO₂." },
        { term: "Oxygen slider", text: "below a threshold, the flame starts producing visible black soot — a sign the fuel isn't fully burning." },
        { term: "Fuel buttons", text: "flame colour depends on what's actually burning — magnesium burns dazzling white hot enough to be used in flares and fireworks." },

        }, "chip" + (i === 0 ? " active" : ""));
      });

      setConcept("A candle flame needs <strong>enough oxygen</strong> to burn completely and cleanly — starve it of oxygen and it still burns, but produces soot and carbon monoxide instead, which is exactly why poorly ventilated fires are dangerous. Different fuels also burn with very different flame colours and intensities.");

      var raf = null, lastT = null;

  SIMULATIONS.push({
    id: "saturation", subject: "Chemistry", title: "Solutions & Saturation", icon: "🧂",
    mount: function () {
      var c2d = LabKit.canvas2d(viewportEl);
      var state = { added: 20, temp: 25 };

      function maxSolubleAt(temp) { return 30 + temp * 0.6; }

      function draw() {
        var ctx = c2d.ctx, dpr = c2d.dpr(), W = c2d.canvas.width, H = c2d.canvas.height;
        ctx.clearRect(0, 0, W, H);
        var cap = maxSolubleAt(state.temp);
        var dissolved = Math.min(state.added, cap);
        var undissolved = Math.max(0, state.added - cap);

        var glassX = W * 0.35, glassY = H * 0.2, glassW = W * 0.3, glassH = H * 0.6;
        ctx.strokeStyle = "#9aa0c7"; ctx.lineWidth = 2 * dpr;
        ctx.strokeRect(glassX, glassY, glassW, glassH);
        ctx.fillStyle = "rgba(79,209,232,0.25)"; ctx.fillRect(glassX, glassY + glassH * 0.15, glassW, glassH * 0.85);

        var pileH = Math.min(glassH * 0.3, (undissolved / 40) * glassH * 0.3);
        ctx.fillStyle = "#e7ecf4"; ctx.fillRect(glassX, glassY + glassH - pileH, glassW, pileH);

        document.getElementById("ro-dissolved").textContent = dissolved.toFixed(0) + " g";
        document.getElementById("ro-undissolved").textContent = undissolved.toFixed(0) + " g";
        document.getElementById("ro-sat").textContent = state.added >= cap ? "Saturated" : "Unsaturated";
        setFormula("Maximum soluble at " + state.temp + "°C ≈ <span class=\"hi\">" + cap.toFixed(0) + "</span> g — warmer water dissolves more.");
      }

      clearPanel(readoutsEl);
      LabKit.readout(readoutsEl, "dissolved", "Dissolved");
      LabKit.readout(readoutsEl, "undissolved", "Undissolved (settled)");
      LabKit.readout(readoutsEl, "sat", "Status");

      clearPanel(controlsEl);
      LabKit.slider(controlsEl, { key: "sa-add", label: "Sugar added", min: 0, max: 80, step: 1, value: 20, unit: " g", onInput: function (v) { state.added = v; draw(); } });
      LabKit.slider(controlsEl, { key: "sa-temp", label: "Water temperature", min: 0, max: 90, step: 1, value: 25, unit: "°C", onInput: function (v) { state.temp = v; draw(); } });
      LabKit.glossary(controlsEl, [
        { kind: "term", term: "Saturated solution", text: "holds the maximum amount of solute the solvent can dissolve at that temperature — any more just settles, undissolved." },
        { term: "Temperature slider", text: "raises the solvent's dissolving capacity — the same water can hold more sugar once it's warmer." },
      ]);

      setConcept("If stirring longer isn't dissolving more sugar, the solution is probably already <strong>saturated</strong> at that temperature — the fix is more water or more heat, not more stirring.");
      draw();
      return function () { c2d.dispose(); };
    },
  });

  SIMULATIONS.push({
    id: "reflexarc", subject: "Biology", title: "Reflex Arc Race", icon: "✋",
    mount: function () {

      var state = { progress: 0, running: false, lastTime: null, location: "Fingertip" };

      function reflexTime() {
        var distance = LOCATIONS[state.location];

      }

      function updateReadouts() {
        document.getElementById("ro-dist").textContent = LOCATIONS[state.location].toFixed(2) + " m to spinal cord";

        var ctx = c2d.ctx, dpr = c2d.dpr(), W = c2d.canvas.width, H = c2d.canvas.height;

        ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();

          ctx.fillStyle = "#e7ecf4"; ctx.font = (10 * dpr) + "px 'Nunito', sans-serif"; ctx.textAlign = "center";
          ctx.fillText(s, sx, y + 24 * dpr);
        });

        var signalX = x0 + state.progress * (x1 - x0);
        ctx.fillStyle = "#ffd166"; ctx.beginPath(); ctx.arc(signalX, y, 9 * dpr, 0, Math.PI * 2); ctx.fill();

        document.getElementById("ro-timer").textContent = state.lastTime !== null ? state.lastTime.toFixed(2) + " s" : "—";
      }

      LabKit.readout(readoutsEl, "dist", "Signal travel distance");

      clearPanel(controlsEl);
      LabKit.glossary(controlsEl, [
        { kind: "term", term: "Reflex action", text: "a rapid, automatic, involuntary response that doesn't wait for conscious thought from the brain." },
        { kind: "term", term: "Reflex arc", text: "the exact signal path: receptor → sensory neuron → spinal cord → motor neuron → muscle." },
        { kind: "term", term: "Nerve conduction distance", text: "a reflex starting further from the spinal cord has further to travel both ways, so it takes slightly longer." },
        { term: "Location buttons", text: "a toe is roughly 30 cm further from the spinal cord than a fingertip — enough to measurably lengthen the reflex." },
        { term: "Trigger button", text: "watch the signal travel the full arc — notice the brain itself is never part of the path." },
      ]);

      clearPanel(globalControlsEl);
      Object.keys(LOCATIONS).forEach(function (loc, i) {
        var btn = LabKit.button(globalControlsEl, loc, function () {
          if (state.running) return;
          state.location = loc;
          Array.prototype.forEach.call(globalControlsEl.children, function (c) { if (c.classList.contains("chip")) c.classList.remove("active"); });
          btn.classList.add("active"); updateReadouts();
        }, "chip" + (i === 0 ? " active" : ""));
      });
      LabKit.button(globalControlsEl, "Touch hot stove!", function () {
        if (state.running) return;
        state.running = true; state.progress = 0; state.lastTime = null;
        var start = performance.now();
        var dur = 1.2;
        function step() {
          var elapsed = (performance.now() - start) / 1000;

      draw();
      return function () {};
    },
  });

      var row1 = LabKit.el("div", "control"); row1.innerHTML = '<div class="row"><label>Civilization A</label></div>';
      var sel1 = document.createElement("select"); sel1.style.cssText = "width:100%;padding:8px;border-radius:8px;background:var(--panel-2);color:var(--fg);border:1px solid var(--line);";
      Object.keys(civs).forEach(function (c) { var o = document.createElement("option"); o.value = c; o.textContent = c; sel1.appendChild(o); });
      sel1.value = state.a; sel1.addEventListener("change", function () { state.a = sel1.value; render(); });
      row1.appendChild(sel1); controlsEl.appendChild(row1);

      var row2 = LabKit.el("div", "control"); row2.innerHTML = '<div class="row"><label>Civilization B</label></div>';
      var sel2 = document.createElement("select"); sel2.style.cssText = sel1.style.cssText;
      Object.keys(civs).forEach(function (c) { var o = document.createElement("option"); o.value = c; o.textContent = c; sel2.appendChild(o); });
      sel2.value = state.b; sel2.addEventListener("change", function () { state.b = sel2.value; render(); });
      row2.appendChild(sel2); controlsEl.appendChild(row2);

      LabKit.glossary(controlsEl, [
        { kind: "term", term: "River valley civilization", text: "an early civilization that grew up along a major river, relying on it for water, farming and transport." },
        { term: "Dropdowns", text: "every one of these civilizations independently invented writing and monumental architecture, without contact with each other." },
      ]);

      setConcept("Despite having no contact with each other, these civilizations independently solved the <strong>same basic challenges</strong> — reliable farming, a writing system, organized cities — each in its own distinctive way.");
      render();
      return function () { viewportEl.innerHTML = ""; };
    },
  });

  // ============================================================
  // Shell wiring: sidebar + mount/unmount lifecycle
  // ============================================================
  var activeDispose = null;
  var activeId = null;

  function renderSidebar() {
    sidebarEl.innerHTML = "";
    var bySubject = {};
    SIMULATIONS.forEach(function (s) { (bySubject[s.subject] = bySubject[s.subject] || []).push(s); });
    ["Math", "Physics", "Chemistry", "Biology", "Geography", "History"].forEach(function (subj) {
      if (!bySubject[subj]) return;
      var label = LabKit.el("div", "group-label", subj);
      sidebarEl.appendChild(label);
      bySubject[subj].forEach(function (s) {
        var btn = LabKit.el("button", "sim-btn" + (s.id === activeId ? " active" : ""));
        btn.innerHTML = '<span class="dot" style="background:' + SUBJECT_COLOR[subj] + '"></span><span class="ic">' + s.icon + '</span><span>' + s.title + '</span>';
        btn.addEventListener("click", function () { mountSim(s.id); });
        sidebarEl.appendChild(btn);
      });
    });
  }

  function mountSim(id) {
    var sim = SIMULATIONS.filter(function (s) { return s.id === id; })[0];
    if (!sim) return;
    if (activeDispose) { try { activeDispose(); } catch (e) {} activeDispose = null; }
    activeId = id;
    dragHintEl.style.display = "none";
    subjectChipEl.textContent = sim.subject;
    subjectChipEl.style.color = SUBJECT_COLOR[sim.subject];
    subjectChipEl.style.borderColor = SUBJECT_COLOR[sim.subject];
    simTitleEl.textContent = sim.title;
    // Reset every shared panel centrally before mounting, so a simulation
    // that doesn't use a given panel (most History/Geography explorers have
    // no numeric formula, for instance) can never leak the PREVIOUS
    // simulation's leftover content into it. Individual mount() functions
    // still repopulate whichever panels actually apply to them.
    clearPanel(globalControlsEl);
    clearPanel(controlsEl);
    clearPanel(readoutsEl);
    clearPanel(conceptEl);
    formulaEl.innerHTML = "";
    formulaBoxEl.classList.add("hidden");
    activeDispose = sim.mount();
    renderSidebar();
  }

  renderSidebar();
  mountSim(SIMULATIONS[0].id);
})();
</script>
</body>
</html>
