<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ICSE Arena — Admin</title>
<style>
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #0f172a;
    color: #f1f5f9;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0;
    padding: 1rem;
  }
  .card {
    background: rgba(30, 41, 59, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 1rem;
    padding: 2rem;
    max-width: 26rem;
    width: 100%;
  }
  h1 { font-size: 1.25rem; margin: 0 0 0.25rem; }
  p.sub { color: #94a3b8; font-size: 0.85rem; margin: 0 0 1.5rem; }
  input {
    width: 100%;
    box-sizing: border-box;
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 0.5rem;
    color: #f1f5f9;
    padding: 0.7rem 1rem;
    font-size: 0.9rem;
    margin-bottom: 1rem;
  }
  button {
    width: 100%;
    border: none;
    border-radius: 0.5rem;
    padding: 0.75rem;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    background: linear-gradient(to right, #10b981, #06b6d4);
    color: #0f172a;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #result { margin-top: 1.25rem; font-size: 0.85rem; }
  #passcode {
    font-size: 2rem;
    font-weight: 800;
    letter-spacing: 0.15em;
    color: #6ee7b7;
    text-align: center;
    margin: 0.5rem 0;
  }
  #error { color: #fb7185; }
  #nextRotation { color: #94a3b8; text-align: center; }
</style>
</head>
<body>
  <div class="card">
    <h1>Admin — This Week's Passcode</h1>
    <p class="sub">Enter your admin key to look up the passcode currently valid for students. It auto-rotates every Monday (UTC) — no action needed on your part.</p>
    <input id="adminKeyInput" type="password" placeholder="Admin key" autocomplete="off" />
    <button id="lookupBtn">Get This Week's Passcode</button>
    <div id="result"></div>
  </div>

  <script>
    // Same Worker as the main app's login gate — see access-worker/.
    const ACCESS_WORKER_URL = "https://icse-arena-access.sandeepdannapuneni.workers.dev";

    const adminKeyInput = document.getElementById("adminKeyInput");
    const lookupBtn = document.getElementById("lookupBtn");
    const result = document.getElementById("result");

    async function lookup() {
      const adminKey = adminKeyInput.value.trim();
      if (!adminKey) {
        result.innerHTML = '<p id="error">Enter your admin key first.</p>';
        return;
      }
      if (ACCESS_WORKER_URL.indexOf("REPLACE_WITH") === 0) {
        result.innerHTML = '<p id="error">Worker URL not configured yet — see access-worker/README.md.</p>';
        return;
      }

      lookupBtn.disabled = true;
      lookupBtn.textContent = "Checking…";
      result.innerHTML = "";

      try {
        const res = await fetch(ACCESS_WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "admin-passcode", adminKey: adminKey }),
        });
        const data = await res.json();
        if (data.ok) {
          const nextDate = new Date(data.nextRotationAt);
          result.innerHTML =
            '<div id="passcode">' + data.passcode + '</div>' +
            '<p id="nextRotation">Valid until ' + nextDate.toUTCString() + '</p>';
        } else {
          result.innerHTML = '<p id="error">' + (data.error || "Invalid admin key") + '</p>';
        }
      } catch (err) {
        result.innerHTML = '<p id="error">Couldn\'t reach the access server — check your internet connection.</p>';
      } finally {
        lookupBtn.disabled = false;
        lookupBtn.textContent = "Get This Week's Passcode";
      }
    }

    lookupBtn.addEventListener("click", lookup);
    adminKeyInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") lookup();
    });
  </script>
</body>
</html>
